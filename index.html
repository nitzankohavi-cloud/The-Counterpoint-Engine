      const attackTime = Math.min(0.035, dur * 0.25);
      const settleTime = 0.12;
      let env;

      if (elapsed < attackTime) {
        env = peakSwell * (elapsed / attackTime);
      } else {
        const settleElapsed = elapsed - attackTime;
        const k = Math.min(1, settleElapsed / settleTime);
        // Cubic ease-out: a smooth, cushioned settle down to the living
        // breath cushion, not a mechanical snap or an elastic overshoot.
        const eased = 1 - Math.pow(1 - k, 3);
        env = peakSwell + (sustainSwell - peakSwell) * eased;
      }

      breathe = env;
      // Living hydraulic respiration: once the initial attack has settled
      // (above), the note is no longer frozen -- a gentle, continuous
      // breathing wave keeps riding on the settled living-breath cushion
      // for as long as the note keeps sounding, seeded per-note (noteSeed)
      // so simultaneously-held notes don't all pulse in lockstep. It
      // contributes nothing once the note ends, handing off cleanly to the
      // permanent capillary drying edge (see isPostRelease below).
      const breathPulse = Math.sin((elapsed - 0.12) * 3.6 + noteSeed(n.id) * 6.28) * (baseHalf * 0.032);
      // Liquid sheen: the ink's own alpha ramps up out of the resting matte
      // tone (~0.72) toward full, commanding wet saturation (~0.98) across
      // the very same attack window the hydraulic swell above uses, so the
      // stroke visually "wets" exactly as it physically expands.
      const wetIn = Math.min(1, elapsed / Math.max(0.001, attackTime));
      const sheen = 0.72 + (0.98 - 0.72) * wetIn;
      activeNotes.push({ x0, x1, y, half: baseHalf + (breathe * 0.5) + breathPulse, id: n.id, dur, breathe, midi: n.midi, elapsed, vel: n.vel, sheen });
      if (tensionBuf) tensionBuf.push({ x0, x1, y, half: baseHalf + (breathe * 0.5) + breathPulse, midi: n.midi, voiceId: voice.id });
    } else if (isPostRelease) {
      // Release dry-down: the liquid sheen absorbs back into the rag paper
      // over ~80ms -- the living breath cushion fading to nothing and the
      // wet alpha settling back to the dry matte resting tone -- leaving
      // only the permanent 0.75px capillary drying edge (drawInkBite) as
      // the note's lasting mark once the fade completes.
      const relElapsed = t - n.endSec;
      const relFade = Math.max(0, 1 - (relElapsed / 0.08));
      breathe = baseHalf * 0.03 * relFade;
      const sheen = 0.72 + (0.98 - 0.72) * relFade;
      activeNotes.push({ x0, x1, y, half: baseHalf + (breathe * 0.5), id: n.id, dur, breathe, midi: n.midi, elapsed: dur, vel: n.vel, sheen });
    } else {
      restingNotes.push({ x0, x1, y, half: baseHalf, id: n.id, dur, vel: n.vel });
    }

    out.drawn++;
    if (state.highlight && state.motifOf[n.id] !== MOTIF.EPISODE) out.thematic++;
  }

  if (restingNotes.length > 0) {
    if (state.audible) {
      fillMatteInk(ctx, restingNotes, voice.palette.base);
      drawInkBite(ctx, restingNotes, ds);
    } else {
      ctx.beginPath();
      for (let j = 0; j < restingNotes.length; j++) {
        const rn = restingNotes[j];
        woodblockPath(ctx, rn.x0, rn.x1, rn.y, rn.half, STROKE.radius, noteSeed(rn.id));
      }
      ctx.fillStyle = voice.palette.silent;
      ctx.fill();
    }
  }

  if (activeNotes.length > 0) {
    fillWetInk(ctx, activeNotes, voice.palette.base, ds);
    drawInkBite(ctx, activeNotes, ds);

    // Pedal-point ink pooling: on notes long enough to actually sustain
    // (dur > 2.2s -- ordinary Bach sixteenths and eighths never qualify),
    // the pigment deepens by a few percent toward the tail, as if the ink
    // were settling further into the fibres the longer it sits. A single
    // extra fill per qualifying note, individually coloured -- and in real
    // Bach counterpoint there are rarely more than one or two such notes
    // sounding at once, so this never threatens the per-note wash budget the
    // rest of the pass already spends.
    const rgb = voice.palette.rgb;
    for (let k = 0; k < activeNotes.length; k++) {
      const an = activeNotes[k];
      if (an.dur <= 2.2 || !rgb) continue;
      const settle = Math.max(0, Math.min(1, (an.elapsed - 0.3) / Math.max(0.4, an.dur - 0.3)));
      if (settle <= 0.02) continue;
      const pool = settle * 0.035;
      ctx.beginPath();
      woodblockPath(ctx, an.x0, an.x1, an.y, an.half, STROKE.radius, noteSeed(an.id));
      ctx.fillStyle = `rgb(${Math.round(rgb[0] * (1 - pool))}, ${Math.round(rgb[1] * (1 - pool))}, ${Math.round(rgb[2] * (1 - pool))})`;
      ctx.fill();
    }
  }
}

/**
 * Capillary tension: when two voices in DIFFERENT parts are sounding a
 * major or minor second apart, the closest edges of their two strokes get a
 * microscopic ink pull toward each other -- close enough that wet ink on
 * damp paper genuinely does this. Strength falls off smoothly as the
 * interval widens past a second and disappears entirely beyond it; nothing
 * here compares notes that are not actually sounding at the same instant.
 *
 * O(n^2) over currently-SOUNDING notes only -- in real Bach counterpoint
 * that is a handful at any instant, so the quadratic cost here is trivial
 * regardless of how large the score is.
 */
function drawCapillaryTension(ctx, candidates, dpr) {
  if (candidates.length < 2) return;
  const px = 1 / (dpr || 1);
  ctx.beginPath();
  let any = false;
  for (let i = 0; i < candidates.length; i++) {
    const a = candidates[i];
    for (let j = i + 1; j < candidates.length; j++) {
      const b = candidates[j];
      if (a.voiceId === b.voiceId) continue;
      const interval = Math.abs(a.midi - b.midi);
      if (interval < 0.5 || interval > 2.999) continue;
      if (a.x1 < b.x0 || b.x1 < a.x0) continue; // no time overlap right now
      const strength = Math.max(0, 1 - (interval - 1) / 2);
      if (strength < 0.04) continue;
      const ox = Math.max(a.x0, b.x0), ex = Math.min(a.x1, b.x1);
      const midX = (ox + ex) * 0.5;
      const ay = a.y + (a.midi < b.midi ? a.half : -a.half);
      const by = b.y + (b.midi < a.midi ? b.half : -b.half);
      ctx.moveTo(midX, ay);
      ctx.quadraticCurveTo(midX, (ay + by) * 0.5, midX, by);
      any = true;
    }
  }
  if (!any) return;
  ctx.strokeStyle = "rgba(20, 14, 8, 0.06)";
  ctx.lineWidth = px;
  ctx.stroke();
}

/**
 * The unison seam: a single delicate 1px hairline drawn at the shared,
 * un-offset pitch centreline between two notes that collide -- the same
 * pitch, the same instant, two different voices -- right through the
 * middle of the narrow band where their now vertically-offset strokes
 * (see UNISON_OFFSET / drawVoiceNotes) actually overlap and blend. Queued
 * once per colliding pair by drawVoiceNotes (see the "top"-tagged branch
 * there) and drawn here, AFTER every voice's own ink is already down, so
 * it reads as a fine seam inside the shared band rather than a line
 * floating over bare paper.
 */
function drawUnisonDividers(ctx, dividers, dpr) {
  if (!dividers || dividers.length === 0) return;
  const px = 1 / (dpr || 1);
  ctx.beginPath();
  for (let i = 0; i < dividers.length; i++) {
    const d = dividers[i];
    const y = snap(d.y, dpr) + px * 0.5;
    ctx.moveTo(d.x0, y);
    ctx.lineTo(d.x1, y);
  }
  ctx.strokeStyle = "rgba(255, 250, 235, 0.22)";
  ctx.lineWidth = px;
  ctx.stroke();
}

function noteSeed(id) {
  let x = (id * 2654435761) >>> 0;
  x ^= x >>> 15; x = (x * 2246822519) >>> 0;
  x ^= x >>> 13; x = (x * 3266489917) >>> 0;
  return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
}

/* ==========================================================================
 * 10c. VOICE LEGEND
 *
 * The one piece of on-plate typography kept from the old technical HUD --
 * not a diagnostic readout, just which colour belongs to which voice, set
 * quietly in the same italic hand as the rest of the illuminated page.
 * ========================================================================== */

/**
 * The playhead: a minimalist hairline rule across the pitch field, nothing
 * more -- no glow, no fill, no beam. Snapped to the device pixel grid so it
 * stays a true single-pixel line at any DPR rather than a soft two-pixel
 * smear, exactly like every other crisp edge in this piece.
 */
function drawPlayhead(ctx, view) {
  if (!view) return;
  const dpr = view.dpr || 1;
  const x = snap(view.playheadX, dpr) + 0.5 / dpr;
  ctx.beginPath();
  ctx.moveTo(x, view.top);
  ctx.lineTo(x, view.bottom);
  ctx.strokeStyle = inkOf();
  ctx.globalAlpha = 0.55;
  ctx.lineWidth = 1 / dpr;
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawPlateLegend(ctx, score, v) {
  if (!score || !v) return;
  ctx.save();
  ctx.font = 'italic 12px "EB Garamond", Georgia, serif';
  ctx.textBaseline = "middle";

  const totalVoices = score.voices.length;
  const items = [];
  let totalWidth = 0;
  for (let i = 0; i < totalVoices; i++) {
    const voice = score.voices[i];
    const nameWidth = ctx.measureText(voice.label).width;
    items.push({ voice, width: 14 + nameWidth });
    totalWidth += 14 + nameWidth + (i < totalVoices - 1 ? 22 : 0);
  }

  const startX = Math.round((PLATE.width - totalWidth) / 2);
  const y = v.top - 20;

  let curX = startX;
  for (let i = 0; i < items.length; i++) {
    const { voice, width } = items[i];
    ctx.fillStyle = voice.palette.base;
    ctx.beginPath();
    ctx.arc(curX + 4, y, 4.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = THEME.inkSoft;
    ctx.textAlign = "left";
    ctx.fillText(voice.label, curX + 13, y);

    curX += width + 22;
  }
  ctx.restore();
}

/**
 * The macro overview strip beneath the deck: a condensed, whole-piece
 * silhouette of note density per voice row, with a hairline cursor marking
 * the current playhead position. Ink on paper only, no glow, matching every
 * other mark on the plate.
 */
function drawMinimap(ctx, score, analysis, width, height, t, rowOf) {
  ctx.clearRect(0, 0, width, height);
  if (!score || !(width > 0) || !(height > 0)) return;
  const dur = Math.max(1e-6, score.durSec);
  const rows = Math.max(1, score.voices.length);
  const rowH = height / rows;

  ctx.fillStyle = THEME.minimapInk;
  for (const voice of score.voices) {
    const row = (rowOf && rowOf[voice.id] != null && rowOf[voice.id] >= 0) ? rowOf[voice.id] : 0;
    const y = row * rowH + rowH * 0.15;
    const h = Math.max(1, rowH * 0.7);
    for (const n of voice.notes) {
      const x0 = (n.startSec / dur) * width;
      const x1 = Math.max(x0 + 0.6, (n.endSec / dur) * width);
      ctx.fillRect(x0, y, x1 - x0, h);
    }
  }

  const x = Math.max(0, Math.min(width, (t / dur) * width));
  ctx.strokeStyle = THEME.minimapCursor;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x + 0.5, 0);
  ctx.lineTo(x + 0.5, height);
  ctx.stroke();
}

/* ==========================================================================
 * 11. PROLOGUE (Dynamic Auto-Measuring Table Layout)
 * ========================================================================== */

const PROLOGUE_SEC = 3.5;
const UNFOLD_START = 2.6;
// Golden-ratio breathing room beneath the melodic contour blueprint (see
// gapRuleCatalog in drawMonogram), rather than an arbitrary multiple of
// the catalogue's own type size.
const GOLDEN_RATIO = 1.6180339887;
const DISPLAY_STACK = '"EB Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif';
const MONO_STACK = '"Geist Mono",ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace';
// The title card's own display face: elegant, humanist Cormorant Garamond
// set in dignified Title Case -- the poise of an authentic 18th-century
// copperplate title page, not a screaming, all-caps engraved display face
// or the general body serif used everywhere else on the plate.
const TITLE_STACK = '"Cormorant Garamond",serif';

const inkOf = () => THEME.ink;
const inkSoftOf = () => THEME.inkSoft;
const ruleOf = () => THEME.ruleOctave;
const glowOf = () => THEME.glow;

const unfoldFraction = (t) => (t <= UNFOLD_START ? 0 : Math.min(1, (t - UNFOLD_START) / (PROLOGUE_SEC - UNFOLD_START)));
const ease = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);

class Prologue {
  constructor() { this.startedAt = 0; this.monogram = null; this.active = false; }
  begin(monogram, now) { this.monogram = monogram; this.startedAt = now; this.active = true; }
  cancel() { this.active = false; }
  elapsed(now) { return (now - this.startedAt) / 1000; }
  draw(ctx, score, view, now) {
    if (!this.monogram) return { scoreAlpha: 1, done: true };
    const t = Math.min(PROLOGUE_SEC, this.elapsed(now));
    const frame = drawMonogram(ctx, this.monogram, score, view,
      view ? view.width : 0, view ? view.height : 0, unfoldFraction(t), t);
    if (t >= PROLOGUE_SEC) { this.active = false; return { scoreAlpha: 1, done: true }; }
    return frame;
  }
}

const STAMP_SETTLE = 0.45;

/**
 * The title card's entry: a stamp, not a fade or a slide.
 *
 * A physical stamp strikes instantly -- full position, full ink, in one
 * frame, not eased in from nothing or slid from off-plate. What DOES take a
 * moment is the impression settling into the fibres, and -- the card's true
 * centerpiece -- the melodic contour blueprint of the opening subject,
 * drawn over its own faint 5-line drafting stave in bistre ink, pivot notes
 * marked. As the prologue's own `e` (0 -> 1) carries the title card away,
 * every contour point glides in a straight line from its position inside
 * this card out to its real coordinate on the staves, so the sketch hands
 * off seamlessly to the actual notes fading in at that very same spot. A
 * confident, generously-tracked serif title sits above -- rendered with its
 * own letterpress ink-bite (see fillTitlePressed), so it reads as genuinely
 * pressed from an engraved copperplate rather than flat word-processor
 * text; a quiet, tracked small-caps catalogue number sits below. No
 * catalogue table, no matrix chart, no pseudo-Italian attribution line, no
 * decorative seal or clipart -- the spatial composition, the paper, and the
 * ink carry the whole authority of the page.
 *
 * `stampT` is seconds elapsed since the prologue itself began; kept as a
 * parameter for callers that may want it, though the current layout does
 * not need it directly -- `u`/`e` alone drive the whole animation.
 */
function drawMonogram(ctx, m, score, view, w, h, u, stampT) {
  if (w <= 0 || h <= 0) return { scoreAlpha: 1, done: true };
  const e = ease(u);
  const cardAlpha = 1 - e;

  ctx.save();
  ctx.fillStyle = THEME.paper;
  ctx.globalAlpha = Math.min(1, 1 - e * 0.98);
  ctx.fillRect(0, 0, w, h);
  ctx.globalAlpha = 1;

  if (cardAlpha > 0.004) {
    // Ink absorbing into the page, not text painted over it -- the exact
    // same compositing every note on the plate itself uses.
    ctx.globalCompositeOperation = THEME.blend;
    ctx.globalAlpha = cardAlpha;
    ctx.textBaseline = "alphabetic";
    ctx.textAlign = "center";

    const cx = w * 0.5;
    // Elegant, humanist scale: ~5.2% of plate height, weight 600, with
    // generous, balanced letter-spacing and its own letterpress ink-bite --
    // the poise of an authentic 18th-century copperplate title page, not a
    // screaming, all-caps engraved display face or a website header set in
    // a lightweight word-processor font.
    const titleSize = h * 0.052;
    const catalogSize = h * 0.02;
    const lead = titleSize * 1.22;
    // Full 65% of plate width and 18% of plate height: the melodic contour
    // blueprint as the card's true centerpiece (see drawContour), not a
    // cramped footnote sketch.
    const glyphBoxW = w * 0.65;
    const glyphBoxH = h * 0.18;
    const gapTitleGlyph = h * 0.032;
    const gapGlyphRule = h * 0.026;
    const gapRuleCatalog = catalogSize * GOLDEN_RATIO;

    ctx.fillStyle = inkOf();
    ctx.font = `600 ${titleSize}px ${TITLE_STACK}`;
    if (m._wrapW !== w) { m._wrapW = w; m._lines = wrapText(ctx, m.title, w * 0.62); }
    const lines = m._lines;
    const titleBlockH = lines.length * lead;
    const blockH = titleBlockH + gapTitleGlyph + glyphBoxH + gapGlyphRule + catalogSize + gapRuleCatalog;

    let y = h * 0.5 - blockH * 0.5 + titleSize;
    const titleTracking = Math.max(0.6, titleSize * 0.07);
    const dpr = view ? (view.dpr || 1) : 1;
    lines.forEach((line) => { fillTitlePressed(ctx, line, cx, y, titleTracking, dpr); y += lead; });

    // The melodic contour blueprint -- the centerpiece of the opening.
    const glyphBoxTop = y + gapTitleGlyph;
    const glyphBoxX = cx - glyphBoxW / 2;
    drawContour(ctx, m.glyph, view, glyphBoxX, glyphBoxTop, glyphBoxW, glyphBoxH, e, cardAlpha);

    // A hair-thin, organic dividing stroke beneath the contour -- barely
    // there, the way a single ruled line under a heading settles into old
    // paper rather than announcing itself as a UI divider.
    const ruleY = glyphBoxTop + glyphBoxH + gapGlyphRule;
    ctx.strokeStyle = ruleOf();
    ctx.lineWidth = Math.max(0.35, 0.7 / (view ? (view.dpr || 1) : 1));
    ctx.globalAlpha = cardAlpha * 0.35;
    ctx.beginPath();
    ctx.moveTo(cx - w * 0.09, ruleY);
    ctx.lineTo(cx + w * 0.09, ruleY);
    ctx.stroke();
    ctx.globalAlpha = cardAlpha;

    // Catalogue number only, set quietly in tracked small-caps beneath the
    // contour -- no pseudo-Italian attribution line.
    if (m.catalogue && m.catalogue !== "\u2014") {
      ctx.fillStyle = inkSoftOf();
      ctx.font = `${catalogSize}px ${DISPLAY_STACK}`;
      fillTextTracked(ctx, m.catalogue.toUpperCase(), cx, ruleY + gapRuleCatalog, catalogSize * 0.16);
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }

  ctx.restore();
  return { scoreAlpha: e, done: u >= 1 };
}

/**
 * The melodic contour blueprint: a faint 5-line drafting stave laid down
 * first (7% opacity, bistre ink) -- the guideline a real master draft was
 * ruled against before a single note went down -- with the taut line of
 * the opening subject (or theme) drawn over it, its pivot notes marked with
 * small organic ink beads. Drawn once inside its own card-space bounding
 * box, then -- as the prologue's `e` carries the title card away -- every
 * contour point glides in a straight line from that card position onto its
 * real coordinate on the staves (`gx + (sx - gx) * e`, `gy + (sy - gy) *
 * e`), so the sketch seamlessly hands off to the actual notes fading in at
 * the very same instant and place. Bistre ink only, at the ambient card
 * alpha -- no glow of any kind.
 *
 * The line itself is drawn as taut, deliberate, straight-edge quill
 * drafting vectors directly between consecutive pivot notes -- a master
 * draftsman's ruled line, not a sagging, rounded curve fit through the
 * points -- and each segment's own stroke thickness still responds to the
 * melodic gesture it crosses: a true downward step (the pitch falling) is
 * drawn like a pen's natural, heaviest downstroke (~1.8px); a leap of a
 * third or more, or any rising gesture, is drawn like the lighter
 * upstroke/lift a quill makes crossing back up the page (~0.75px); a
 * repeated pitch sits at a neutral midpoint between the two. Pivot points
 * (leaps, suspensions, turns) remain precise, organic ink beads.
 */
function drawContour(ctx, glyph, view, boxX, boxY, boxW, boxH, e, cardAlpha) {
  if (!glyph || glyph.kind !== "contour" || !glyph.points || glyph.points.length < 2 || !view) return;
  const pts = glyph.points;

  // The drafting stave: five faint, evenly-spaced guideline rules behind
  // the contour -- an authentic master-draft sketch, not a floating,
  // unanchored squiggle.
  ctx.save();
  ctx.strokeStyle = inkOf();
  ctx.globalAlpha = cardAlpha * 0.07;
  ctx.lineWidth = Math.max(0.5, 0.6 / (view.dpr || 1));
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const ly = boxY + (boxH * i) / 4;
    ctx.moveTo(boxX, ly);
    ctx.lineTo(boxX + boxW, ly);
  }
  ctx.stroke();
  ctx.restore();

  const mapped = pts.map((p) => {
    const gx = boxX + p.u * boxW;
    const gy = boxY + (1 - p.v) * boxH;
    const sx = xOfSec(view, p.sec, 0);
    const sy = yOfMidi(view, p.midi);
    return { x: gx + (sx - gx) * e, y: gy + (sy - gy) * e, pivot: p.pivot };
  });

  // Taut, deliberate quill drafting vectors: a straight-edge stroke drawn
  // directly between each pair of consecutive pivot notes, anchored cleanly
  // over the drafting stave above -- no spline, no bezier, no sagging
  // rounded loop of any kind.
  ctx.save();
  ctx.lineJoin = "miter";
  ctx.lineCap = "butt";
  ctx.strokeStyle = inkOf();
  ctx.globalAlpha = cardAlpha * 0.65;
  const dpr = view.dpr || 1;
  for (let i = 0; i < mapped.length - 1; i++) {
    const p1 = mapped[i];
    const p2 = mapped[i + 1];

    const interval = pts[i + 1].midi - pts[i].midi;
    const isLeap = Math.abs(interval) >= 3;
    const targetW = isLeap || interval > 0 ? 0.75 : interval < 0 ? 1.8 : 1.2;
    ctx.lineWidth = Math.max(0.5, targetW / dpr);

    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();
  }

  // Small organic ink beads at the pivot notes only -- leaps, suspensions,
  // turns -- not one at every point, so they read as marked moments in the
  // melody rather than a dotted line.
  ctx.fillStyle = inkOf();
  for (let i = 0; i < mapped.length; i++) {
    if (pts[i].pivot === "none") continue;
    const p = mapped[i];
    const r = pts[i].pivot === "suspension" ? 2.1 : pts[i].pivot === "leap" ? 1.9 : 1.6;
    ctx.globalAlpha = cardAlpha * 0.78;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

/**
 * Manual letter-spaced text -- the canvas equivalent of the CSS small-caps
 * + tracking treatment used for the deck's own labels elsewhere, since
 * ctx.font has no reliable cross-browser font-variant support. Used for
 * both the title (generous but subtle tracking) and the catalogue (tighter,
 * small-caps-style tracking).
 */
function fillTextTracked(ctx, text, cx, y, tracking) {
  const chars = String(text).split("");
  const widths = chars.map((c) => ctx.measureText(c).width);
  const total = widths.reduce((a, b) => a + b, 0) + tracking * Math.max(0, chars.length - 1);
  const prevAlign = ctx.textAlign;
  ctx.textAlign = "left";
  let x = cx - total / 2;
  chars.forEach((c, i) => {
    ctx.fillText(c, x, y);
    x += widths[i] + tracking;
  });
  ctx.textAlign = prevAlign;
}

/**
 * The title's own letterpress ink-bite: a microscopic (~0.5px) shadow-above,
 * highlight-below impression, using the exact same convention drawInkBite
 * applies to every note on the plate, scaled down to typographic size. A
 * flat fill of glyphs reads as digital text sitting on top of the page; this
 * dark pass just above and light pass just below the true baseline is what
 * makes the title read instead as genuinely pressed into the sheet.
 */
function fillTitlePressed(ctx, text, cx, y, tracking, dpr) {
  const bite = Math.max(0.4, 0.5 / (dpr || 1));
  const mainFill = ctx.fillStyle;
  ctx.fillStyle = "rgba(20, 14, 8, 0.14)";
  fillTextTracked(ctx, text, cx, y - bite, tracking);
  ctx.fillStyle = "rgba(255, 250, 235, 0.12)";
  fillTextTracked(ctx, text, cx, y + bite, tracking);
  ctx.fillStyle = mainFill;
  fillTextTracked(ctx, text, cx, y, tracking);
}

function wrapText(ctx, text, maxWidth) {
  const words = String(text).split(/\s+/);
  const lines = [];
  let line = "";
  for (const word of words) {
    const next = line ? `${line} ${word}` : word;
    if (ctx.measureText(next).width > maxWidth && line) { lines.push(line); line = word; }
    else line = next;
  }
  if (line) lines.push(line);
  return lines.slice(0, 3);
}

/* ==========================================================================
 * 12. EXPORTS
 * ========================================================================== */

const THUMB_WIDTH = 1280, THUMB_HEIGHT = 720;

async function renderFrameZero(score, monogram, width, height) {
  width = width || THUMB_WIDTH; height = height || THUMB_HEIGHT;
  if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }

  const canvas = document.createElement("canvas");
  canvas.width = width; canvas.height = height;
  const ctx = canvas.getContext("2d");
  if (!ctx) throw new Error("2d context unavailable for export");

  const m = width / PLATE.width;
  ctx.setTransform(m, 0, 0, m, 0, 0);
  drawMonogram(ctx, monogram, score, layoutView(score, m, 185), PLATE.width, PLATE.height, 0);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  return canvas;
}

function canvasToBlob(canvas) {
  return new Promise((resolve, reject) => {
    canvas.toBlob((blob) => (blob ? resolve(blob) : reject(new Error("Could not encode thumbnail."))), "image/png");
  });
}

async function exportThumbnail(score, monogram, cached) {
  return canvasToBlob(cached || (await renderFrameZero(score, monogram)));
}

function slug(text) {
  return String(text).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "counterpoint";
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ==========================================================================
 * 13. CONCERT PIANO ENGINE (Yamaha C5 Sampled Audio with Direct Master Tap)
 * ========================================================================== */

const SALAMANDER_BASE = "https://tonejs.github.io/audio/salamander/";
const PIANO_NOTES = [
  "A0", "C1", "D#1", "F#1", "A1", "C2", "D#2", "F#2", "A2", "C3", "D#3", "F#3",
  "A3", "C4", "D#4", "F#4", "A4", "C5", "D#5", "F#5", "A5", "C6", "D#6", "F#6",
  "A6", "C7", "D#7", "F#7", "A7", "C8",
];

const REVERB = { decay: 2.6, preDelay: 0.026, wet: 0.17 };

/**
 * Four distinct, always-selectable Baroque-appropriate voices.
 *
 * PIANO RELEASE: raised to the requested 1.15s so genuinely held chords
 * decay and ring the way a real damper does, rather than choking off. But a
 * FIXED 1.15s release on fast contrapuntal sixteenths is exactly what
 * earlier made this instrument read as an organ: each note's tail is still
 * ringing when the next one's tail begins, and overlapping tails sum into
 * one undifferentiated wash. The resolution is release SCALED to each
 * note's own sounded duration (see releaseFor() in AudioEngine.schedule) --
 * a struck sixteenth decays quickly, the way it does on a real instrument
 * when the next note interrupts it, while a held half note or final chord
 * gets the full 1.15s bloom. Same base value, physically motivated instead
 * of a single number fighting two different kinds of passage.
 *
 * VELOCITY-TRACKING FILTER: one dedicated per-channel Tone.Filter, its
 * cutoff automated (not re-instantiated) at every note's onset from that
 * note's own velocity, interpolated in LOG frequency space between the two
 * anchors below (frequency perception is logarithmic; a linear Hz ramp
 * would feel like nothing happens for the first half of the sweep and
 * everything in the second half). This is what stops quiet notes sounding
 * like a distant tinny clang: a soft strike keeps its warmth instead of
 * being brightness-clamped to the same cutoff as a forte one.
 *
 * Harpsichord and organ do NOT get this same velocity-to-brightness curve:
 * a real harpsichord's quill either plucks or does not (a few dB of level
 * change, negligible timbre change), and a real pipe organ's speech has NO
 * velocity dependence at all -- the valve is binary. Applying piano-style
 * dynamics to either would be historically backwards, not "consistent."
 */
const VELOCITY_FILTER = { v0: 0.275, f0: 1600, v1: 0.925, f1: 12250, floor: 650, ceiling: 15000 };
const FELT_VELOCITY_FILTER = { v0: 0.3, f0: 950, v1: 0.9, f1: 4400, floor: 500, ceiling: 6000 };

/** Log-space interpolation between two (velocity, frequency) anchors. */
function velocityToCutoff(vel, cfg) {
  const v = Math.max(0.05, Math.min(1.05, vel));
  const t = (v - cfg.v0) / (cfg.v1 - cfg.v0);
  const logF = Math.log(cfg.f0) + t * (Math.log(cfg.f1) - Math.log(cfg.f0));
  return Math.max(cfg.floor, Math.min(cfg.ceiling, Math.exp(logF)));
}

/**
 * The high-shelf dampener's gain for a given velocity: soft strikes (at or
 * below 0.35) get the full -5.5dB attenuation above 4.5kHz -- a warm, woody
 * strike with the hammer's harder overtones held back; forte strikes (at or
 * above 0.85) get none at all, letting the hammer's real bite through. This
 * runs alongside velocityToCutoff's lowpass brightening rather than
 * replacing it -- together they are the two-stage timbre model, not one
 * filter doing both jobs.
 */
function velocityToDamperGain(vel) {
  const v = Math.max(0.05, Math.min(1.05, vel));
  const t = Math.max(0, Math.min(1, (v - 0.35) / (0.85 - 0.35)));
  return -5.5 * (1 - t);
}

/**
 * Real-time pitch-to-pan tracking: bass strings resonate gently to the
 * left, treble strings to the right, exactly as they sit across a real
 * soundboard -- replacing a fixed pan assigned once per voice at channel
 * creation, which put an entire voice on one side regardless of how far its
 * own line actually range over the keyboard.
 */
function pitchToPan(midi) {
  return Math.max(-0.24, Math.min(0.24, ((midi - 60) / 48) * 0.22));
}
