<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Counterpoint — Archival Plate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&display=swap">
<style>
:root {
  --paper: #FAF7EE;
  --paper-edge: #F2EBDC;
  --ink: #2A2421;
  --lead: 1.55;
  --gap: 6px;
  --serif: 'Cormorant Garamond', serif;
  --mono: ui-monospace,"SF Mono","Geist Mono","Courier New",monospace;
  color-scheme: light;
}

:root[data-theme="obsidian"] {
  --paper: #141517;
  --paper-edge: #0B0C0D;
  --ink: #E6E2D8;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--paper-edge); color: var(--ink);
  font: 13px/1.45 var(--serif);
  -webkit-font-smoothing: antialiased;
  direction: ltr !important;
  text-align: left !important;
  transition: background 400ms ease, color 400ms ease;
}

#stage { position: fixed; inset: 0; overflow: hidden; cursor: pointer; }
#stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }

/* Shorts (9:16): the stage becomes a tall, narrow box centered in the
   viewport rather than filling it -- resize() then fits the plate to COVER
   this box (scaled up, playhead-centered) instead of containing it, so the
   visible frame is genuinely a vertical crop of the same composition, not
   a letterboxed 16:9 plate floating in a tall window. */
body.shorts-mode #stage {
  inset: auto;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: min(100vw, 56.25vh);
  height: min(100vh, 177.78vw);
  aspect-ratio: 9 / 16;
  box-shadow: 0 0 0 100vmax color-mix(in srgb, var(--ink) 88%, black);
}

.panel {
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  border: 1px solid color-mix(in srgb, var(--ink) 12%, transparent);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  direction: ltr !important;
  text-align: left !important;
  box-shadow: 0 4px 18px -6px color-mix(in srgb, var(--ink) 14%, transparent);
  transition: opacity 340ms ease, transform 340ms ease;
}
body.deck-hidden .autohide,
body.presenting .autohide { opacity: 0; transform: translateY(10px); pointer-events: none; }
body.deck-hidden #deck, body.presenting #deck { transform: translateX(-50%) translateY(10px); }

#deck {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  z-index: 6; max-width: min(1080px, calc(100vw - 40px));
  border-radius: 9999px; padding: 7px 18px;
  display: flex; align-items: center; gap: 9px;
  box-shadow: 0 18px 40px -22px color-mix(in srgb, var(--ink) 45%, transparent);
}
#deck-macro {
  width: 150px; height: 22px; border-radius: 11px; overflow: hidden;
  cursor: pointer; flex: 0 0 auto;
  background: color-mix(in srgb, var(--ink) 5%, transparent);
}
#deck-macro canvas { display: block; width: 100%; height: 22px; }

button, select {
  border: 1px solid color-mix(in srgb, var(--ink) 12%, transparent);
  background: color-mix(in srgb, var(--ink) 6%, transparent);
  color: var(--ink); border-radius: 9999px;
  padding: 5px 12px; font: inherit; font-size: 11.5px; cursor: pointer;
  white-space: nowrap; outline: none;
  transition: background 160ms ease, opacity 160ms ease;
}
select { padding: 4px 8px; font-family: var(--mono); font-size: 11px; }
button:hover:not(:disabled), select:hover { background: color-mix(in srgb, var(--ink) 13%, transparent); }
button:disabled { opacity: 0.32; cursor: default; }
button[aria-pressed="false"] { opacity: 0.45; }
.icon { width: 30px; padding: 5px 0; text-align: center; font-size: 12px; line-height: 1; }
.play { min-width: 64px; font-variant: small-caps; letter-spacing: 0.05em; font-weight: 600; }
.time { font: 11px var(--mono); min-width: 78px; text-align: center; opacity: 0.6; }

.scrub {
  flex: 1 1 120px; min-width: 70px; height: 4px; border-radius: 2px;
  background: color-mix(in srgb, var(--ink) 14%, transparent);
  position: relative; cursor: pointer; touch-action: none;
}
.scrub-fill {
  position: absolute; inset: 0; border-radius: 2px;
  background: color-mix(in srgb, var(--ink) 65%, transparent);
  transform-origin: left center; transform: scaleX(0); will-change: transform;
}
.deck-sep { width: 1px; height: 16px; background: color-mix(in srgb, var(--ink) 14%, transparent); flex: 0 0 auto; }

#status {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 72px; z-index: 5;
  font: 11px var(--mono); text-align: center; pointer-events: none;
  opacity: 0.65; max-width: 70vw;
}
#status.error { color: #B93826; opacity: 1; }
#dropveil {
  position: fixed; inset: 0; display: none; place-items: center; z-index: 20;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  font-size: 15px; pointer-events: none; font-style: italic;
}
body.dropping #dropveil { display: grid; }
#fatal {
  position: fixed; inset: 0; display: none; place-items: center; text-align: center;
  background: var(--paper); padding: 40px; z-index: 30; font-size: 14px; opacity: 0.75;
}
:focus-visible { outline: 1px solid color-mix(in srgb, var(--ink) 50%, transparent); outline-offset: 3px; }

@media (prefers-reduced-motion: reduce) { .panel { transition: none; } }
</style>
</head>
<body>
<main id="stage">
  <canvas id="layer-static"></canvas>
  <canvas id="layer-dynamic"></canvas>
</main>
<div id="status" class="autohide"></div>
<section id="deck" class="panel autohide">
  <div id="deck-macro"><canvas id="layer-minimap"></canvas></div>
  <div id="deck-controls" style="display:contents"></div>
</section>
<div id="dropveil" aria-hidden="true">Drop a MIDI file</div>
<div id="fatal"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/15.0.4/Tone.js" crossorigin="anonymous"></script>
<script>
"use strict";

/* ==========================================================================
 * 1. TEMPO MAP
 * ========================================================================== */

function buildTempoMap(events, ppq) {
  const sorted = [...events].sort((a, b) => a.tick - b.tick);
  if (sorted.length === 0 || sorted[0].tick > 0) sorted.unshift({ tick: 0, usPerQuarter: 500000 });
  const map = [];
  let sec = 0;
  for (let i = 0; i < sorted.length; i++) {
    const ev = sorted[i];
    if (i > 0) {
      const prev = sorted[i - 1];
      sec += ((ev.tick - prev.tick) * prev.usPerQuarter) / ppq / 1e6;
    }
    if (map.length > 0 && map[map.length - 1].tick === ev.tick) map.pop();
    map.push({ tick: ev.tick, sec, usPerQuarter: ev.usPerQuarter });
  }
  return map;
}

function seekByTick(map, tick) {
  let lo = 0, hi = map.length - 1;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (map[mid].tick <= tick) lo = mid; else hi = mid - 1;
  }
  return lo;
}

function seekBySec(map, sec) {
  let lo = 0, hi = map.length - 1;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (map[mid].sec <= sec) lo = mid; else hi = mid - 1;
  }
  return lo;
}

function tickToSec(map, ppq, tick) {
  const p = map[seekByTick(map, tick)];
  return p.sec + ((tick - p.tick) * p.usPerQuarter) / ppq / 1e6;
}

function secToTick(map, ppq, sec) {
  const p = map[seekBySec(map, sec)];
  return p.tick + ((sec - p.sec) * 1e6 * ppq) / p.usPerQuarter;
}

/* ==========================================================================
 * 2. THEME ENGINE — Curated Inks & Crisp Archival Rag
 * ========================================================================== */

const THEMES = [
  {
    id: "vellum",
    name: "Archival Vellum",
    // Four tones, not two: three for the macro mottling across the sheet's
    // own surface (a real hide/rag sheet is never one flat colour), and a
    // fourth, deeper patina the perimeter vignette shades into -- distinct
    // A single continuous sheet now, not a multi-stop material blend -- see
    // the extensive comment on makePaper for why that changed. paperMid is
    // kept as a very small constant tint, not a spatially-varying stop;
    // paperDark is no longer used by the algorithm (kept defined so nothing
    // elsewhere that reads the theme object breaks) and paperEdge remains
    // the vignette-only tone, confined strictly to the outer margin.
    paper: "#FAF7EE",      // luminous ivory -- the sheet's one true tone
    paperMid: "#F3EEE3",   // a whisper of secondary tint, applied uniformly
    paperDark: "#EBE0CD",
    paperEdge: "#F2EBDC",  // perimeter patina -- outer 20% only, kept close to paper for a luminous, unaged edge
    ink: "#2A2421",
    // Whisper-quiet: 8% opacity, and (see drawPaper) confined to true
    // octave (C-note) lines within C1-C6 only -- no other background
    // pitch-guide clutter of any kind survives.
    rulerOctave: "rgba(145, 135, 120, 0.08)",
    rulerBarMajor: "rgba(145, 135, 120, 0.18)",
    rulerBarTick: "rgba(145, 135, 120, 0.28)",
    rulerNumber: "rgba(145, 135, 120, 0.42)",
    isDark: false,
    // Four DEEPENED mineral pigments, not a chart palette: the exact desk a
    // Baroque copyist would have had, pushed to a richer, more authoritative
    // presence than a pastel sketch -- madder terracotta, oxidized
    // verdigris, dyer's indigo, and walnut iron-gall, each a real historical
    // ink or pigment. They are also chosen to sit far apart in BOTH hue and
    // lightness -- iron-gall reads as near-black, indigo is the only blue,
    // verdigris the only green, terracotta the only warm red -- so the four
    // stay instantly distinguishable even before a viewer has learned the
    // register convention. Quintus/Sextus (rare 5th/6th voices) keep their
    // own separate identities beyond the four.
    voices: ["#A84825", "#2E724D", "#2B4278", "#261E1A", "#6B3B5A", "#8C6A1E"],
  },
  {
    id: "obsidian",
    name: "Japanese Sumi / Obsidian",
    // Same four-tone structure, at ink-stone magnitudes: a lit stone has real
    // material variation too, just far subtler than parchment fibre.
    paper: "#151619",
    paperMid: "#111215",
    paperDark: "#0E0F11",
    paperEdge: "#0B0C0D",
    ink: "#E6E2D8",
    rulerOctave: "rgba(90, 94, 104, 0.08)",
    rulerBarMajor: "rgba(90, 94, 104, 0.18)",
    rulerBarTick: "rgba(90, 94, 104, 0.28)",
    rulerNumber: "rgba(150, 154, 164, 0.45)",
    isDark: true,
    // Same four pigment identities, lifted in value rather than pushed into
    // saturation -- a lit ink stone, not a screen glow. Bass becomes the
    // warmest neutral (bone) rather than the darkest hue, since "darkest"
    // reads as invisible on a near-black ground; distinctness now comes from
    // being the least colourful voice instead of the most colourful.
    voices: ["#C97A52", "#5FA379", "#6E8FC4", "#C9BFA8", "#9B6E92", "#C9A227"],
  },
];
const DEFAULT_THEME = "vellum";
let activeTheme = THEMES[0];

const VOICE_LABELS = ["Soprano", "Alto", "Tenor", "Bass", "Quintus", "Sextus"];
const labelForIndex = (i) => VOICE_LABELS[i] || `Voice ${i + 1}`;

function parseHex(hex) {
  const n = parseInt(String(hex).slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
const clamp255 = (x) => Math.max(0, Math.min(255, Math.round(x)));
const rgbStr = (r, g, b) => `rgb(${clamp255(r)},${clamp255(g)},${clamp255(b)})`;
const rgbaStr = (r, g, b, a) => `rgba(${clamp255(r)},${clamp255(g)},${clamp255(b)},${a})`;

function mix(c1, c2, k) {
  return [c1[0] + (c2[0] - c1[0]) * k, c1[1] + (c2[1] - c1[1]) * k, c1[2] + (c2[2] - c1[2]) * k];
}

function voiceRamp(theme, n) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const idx = n <= 2 ? i * 2 : i;
    out.push(parseHex(theme.voices[Math.min(idx, theme.voices.length - 1)]));
  }
  return out;
}

function stateColors(rgb, theme) {
  const paper = parseHex(theme.paper);
  const ink = parseHex(theme.ink);
  return {
    base: rgbStr(...rgb),
    // Raw channels, kept alongside the string forms so effects that need to
    // mix toward another colour (pedal-point pooling, below) never have to
    // re-parse an "rgb(...)" string back into numbers every frame.
    rgb,
    resting: rgbaStr(rgb[0], rgb[1], rgb[2], theme.isDark ? 0.65 : 0.72),
    silent: rgbStr(...mix(paper, rgb, theme.isDark ? 0.30 : 0.22)),
  };
}

function registerWeight(index, count) {
  if (count <= 1) return { width: 1 };
  const k = index / (count - 1);
  return { width: 0.96 + k * 0.14 };
}

function applyVoicePalettes(score, theme) {
  const t = theme || activeTheme;
  const ramp = voiceRamp(t, Math.max(1, score.voices.length));
  score.voices.forEach((voice, i) => {
    const weight = registerWeight(i, score.voices.length);
    voice.palette = Object.assign({ label: voice.label }, stateColors(ramp[i], t));
    voice.weight = weight;
  });
  return score;
}

function environmentFor(theme) {
  const [r, g, b] = parseHex(theme.ink);
  const a = (x) => rgbaStr(r, g, b, x);
  return {
    id: theme.id,
    isDark: theme.isDark,
    paper: theme.paper,
    paperMid: theme.paperMid,
    paperDark: theme.paperDark,
    paperEdge: theme.paperEdge,
    ink: a(0.92),
    inkSoft: a(0.55),
    ruleOctave: theme.rulerOctave,
    ruleBarMajor: theme.rulerBarMajor,
    ruleBarTick: theme.rulerBarTick,
    ruleNumber: theme.rulerNumber,
    label: a(0.35),
    labelFont: '10px "EB Garamond", Georgia, serif',
    barNumberFont: 'italic 9.5px "EB Garamond", Georgia, serif',
    playhead: a(0.68),
    minimapInk: a(0.16),
    minimapCursor: a(0.55),
    cartouche: a(0.76),
    consoleFaint: a(0.34),
    glow: `rgba(${clamp255(r)},${clamp255(g)},${clamp255(b)},`,
    accent: theme.ink,
    blend: theme.isDark ? "screen" : "multiply",
  };
}

/* ==========================================================================
 * 2b. AUTHENTIC ARCHIVAL VELLUM (Multi-scale Pulp Tooth & Rag Fibers)
 * ========================================================================== */

/**
 * A single continuous sheet -- not a multi-stop material blend.
 *
 * An earlier pass here used a genuine 3-stop macro-cloud gradient (a slow
 * spatially-coherent noise field selecting a position along ivory -> flax ->
 * oatmeal) specifically to fix a "flat, lifeless" complaint. Seen rendered,
 * that cloud read as mottling -- cowhide, camouflage, a stained sheet -- not
 * as parchment. The lesson is not "texture is good" or "texture is bad," it
 * is that MACRO spatial variation and MICRO surface grain are two entirely
 * different visual phenomena, and only one of them belongs on a sheet meant
 * to read as a single continuous material: fine grain says "paper"; visible
 * macro blotching says "hide" or "stain," no matter how gently it blends.
 *
 * So: the body is one dominant tone with a single, spatially UNIFORM tint
 * mixed in at a fixed ratio (never a noise field choosing how much), plus a
 * sub-pixel analog tooth (+-7.5 RGB) that gives it a palpable, matte pulp
 * surface -- tangible rather than a flat digital fill -- without ever
 * suggesting a shape underneath. The vignette is confined strictly to the
 * outer 20% of the sheet, so the aged edge reads as a frame around a flat
 * page rather than a gradient wash across the whole thing. No trigonometric
 * cloud terms of any kind remain in this function -- every variation below
 * comes from the seeded linear PRNG, never a sine/cosine field.
 *
 * The sheet is left otherwise unmarked: no foxing, no age-spotting, no
 * rust-wash blemishes of any kind -- a master edition belongs on pristine,
 * clean cotton rag, not a stained or foxed page. The only surviving texture
 * is the sub-pixel pulp tooth above and the sparse embedded rag fibers
 * below, both genuinely tactile rather than a mark of age or damage.
 */
function makePaper(w, h) {
  const cw = Math.max(1, Math.ceil(w));
  const ch = Math.max(1, Math.ceil(h));
  const c = document.createElement("canvas");
  c.width = cw; c.height = ch;
  const g = c.getContext("2d");
  const img = g.createImageData(cw, ch);
  const d = img.data;
  const base = parseHex(THEME.paper);
  const mid = parseHex(THEME.paperMid);
  const edge = parseHex(THEME.paperEdge);

  let seed = 0x2f6e2b1 >>> 0;
  const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);

  const cx = cw / 2, cy = ch / 2;
  const maxR = Math.hypot(cx, cy);
  // A fixed, uniform 12% lean toward the secondary tone -- the "whisper of
  // tint" the theme comment promises. Constant everywhere; nothing here
  // varies by position, which is the entire point.
  const TINT = 0.12;
  const sr = base[0] + (mid[0] - base[0]) * TINT;
  const sg = base[1] + (mid[1] - base[1]) * TINT;
  const sb = base[2] + (mid[2] - base[2]) * TINT;
  // The vignette must do nothing at all until 80% of the way to the corner,
  // then ramp over the final 20% -- "confined to the outermost 20%," not a
  // gradient that starts at the centre and happens to be strongest at the
  // edge. smoothstep gives that ramp a soft shoulder rather than a seam.
  const VIGNETTE_START = 0.8;
  const smoothstep01 = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x));

  for (let y = 0; y < ch; y++) {
    for (let x = 0; x < cw; x++) {
      const i = (y * cw + x) * 4;

      // Sub-pixel analog tooth: the ONLY spatial variation in the sheet
      // itself. Three averaged samples keep it a soft grain rather than
      // salt-and-pepper noise, tuned for a palpable, matte pulp feel --
      // a tactile +-7.5 RGB swing rather than a flat digital fill.
      const tooth = ((rnd() + rnd() + rnd()) / 3 - 0.5) * 15.0;

      const distFrac = Math.hypot(x - cx, y - cy) / maxR;
      const k = smoothstep01((distFrac - VIGNETTE_START) / (1 - VIGNETTE_START)) * 0.42;

      d[i]     = clamp255(sr + (edge[0] - sr) * k + tooth);
      d[i + 1] = clamp255(sg + (edge[1] - sg) * k + tooth * 0.95);
      d[i + 2] = clamp255(sb + (edge[2] - sb) * k + tooth * 0.88);
      d[i + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);

  // Rag fibers: sparse and genuinely embedded -- 0.35px lines, one per
  // ~12000 sq. px, at ~7% opacity on the light stock. This is meant to feel
  // woven into the pulp itself, not scattered on top of it; if you can
  // count individual fibres at a glance, it is too strong.
  g.save();
  g.lineWidth = 0.35;
  g.lineCap = "round";
  const numFibers = Math.round((cw * ch) / 12000);
  for (let f = 0; f < numFibers; f++) {
    const fx = rnd() * cw;
    const fy = rnd() * ch;
    const flen = 6 + rnd() * 13;
    const fAngle = rnd() * Math.PI * 2;
    const fCurve = (rnd() - 0.5) * 6;
    const fOpacity = THEME.isDark ? (0.045 + rnd() * 0.025) : (0.055 + rnd() * 0.03);

    g.strokeStyle = THEME.isDark
      ? `rgba(230, 226, 216, ${fOpacity.toFixed(3)})`
      : `rgba(92, 70, 47, ${fOpacity.toFixed(3)})`;
    g.beginPath();
    g.moveTo(fx, fy);
    const midX = fx + Math.cos(fAngle) * (flen * 0.5) + Math.sin(fAngle) * fCurve;
    const midY = fy + Math.sin(fAngle) * (flen * 0.5) - Math.cos(fAngle) * fCurve;
    const endX = fx + Math.cos(fAngle) * flen;
    const endY = fy + Math.sin(fAngle) * flen;
    g.quadraticCurveTo(midX, midY, endX, endY);
    g.stroke();
  }
  g.restore();

  return c;
}

/* ==========================================================================
 * 3. SCORE NORMALIZATION & DEDUPLICATED TIME SIGNATURES
 * ========================================================================== */

function buildScore(input) {
  const ppq = input.ppq;
  const tempoMap = buildTempoMap(input.tempos, ppq);
  let nextId = 0, pitchLo = Infinity, pitchHi = -Infinity, durTick = 0;

  const voices = input.voices.map((raw, voiceId) => {
    const notes = new Array(raw.notes.length);
    let lo = Infinity, hi = -Infinity;
    for (let i = 0; i < raw.notes.length; i++) {
      const n = raw.notes[i];
      const endTick = n.tick + n.durTick;
      notes[i] = {
        id: nextId++, voiceId,
        startTick: n.tick, durTick: n.durTick,
        startSec: tickToSec(tempoMap, ppq, n.tick),
        endSec: tickToSec(tempoMap, ppq, endTick),
        midi: n.midi, vel: n.vel,
      };
      if (n.midi < lo) lo = n.midi;
      if (n.midi > hi) hi = n.midi;
      if (endTick > durTick) durTick = endTick;
    }
    notes.sort((a, b) => a.startSec - b.startSec || a.midi - b.midi);
    if (lo < pitchLo) pitchLo = lo;
    if (hi > pitchHi) pitchHi = hi;
    return {
      id: voiceId, label: raw.label, palette: null, notes,
      lo: isFinite(lo) ? lo : 60, hi: isFinite(hi) ? hi : 60,
    };
  });

  if (!isFinite(pitchLo)) { pitchLo = 48; pitchHi = 72; }

  const score = {
    name: input.name, ppq, tempoMap, voices,
    measures: buildMeasures(input.timeSignatures, tempoMap, ppq, durTick),
    durTick, durSec: tickToSec(tempoMap, ppq, durTick),
    pitchLo: pitchLo - 1,
    pitchHi: pitchHi + 1,
    noteCount: nextId,
  };
  return applyVoicePalettes(score);
}

function buildMeasures(sigs, tempoMap, ppq, durTick) {
  const rawList = sigs && sigs.length ? [...sigs].sort((a, b) => a.tick - b.tick) : [];
  
  // Clean deduplication across tracks
  const list = [];
  for (let r = 0; r < rawList.length; r++) {
    if (list.length > 0 && list[list.length - 1].tick === rawList[r].tick) {
      list[list.length - 1] = rawList[r];
    } else {
      list.push(rawList[r]);
    }
  }

  if (list.length === 0 || list[0].tick > 0) list.unshift({ tick: 0, numerator: 4, denominator: 4 });
  const measures = [];
  let index = 0;
  for (let s = 0; s < list.length; s++) {
    const sig = list[s];
    const until = s + 1 < list.length ? list[s + 1].tick : durTick;
    const ticksPerBar = (sig.numerator * (4 / sig.denominator) * ppq) | 0;
    if (ticksPerBar <= 0) continue;
    for (let t = sig.tick; t < until; t += ticksPerBar) {
      measures.push({
        index: index++, startTick: t, startSec: tickToSec(tempoMap, ppq, t),
        numerator: sig.numerator, denominator: sig.denominator,
      });
    }
  }
  return measures;
}

/* ==========================================================================
 * 4. MIDI INGESTION
 * ========================================================================== */

class MidiShapeError extends Error {}

function readSmf(buffer) {
  const view = new DataView(buffer);
  if (buffer.byteLength < 14) throw new MidiShapeError("File is too short to be a MIDI file.");
  if (str4(view, 0) !== "MThd") throw new MidiShapeError("Not a MIDI file — no MThd header found.");

  const format = view.getUint16(8);
  const ntrks = view.getUint16(10);
  const division = view.getUint16(12);
  if (division & 0x8000) throw new MidiShapeError("SMPTE timecode files are not supported.");
  const ppq = division;
  // A zero (or otherwise non-positive) division field divides by zero in
  // every downstream tempo calculation (tickToSec/secToTick), which
  // propagates as NaN through the whole pipeline silently -- canvas drawing
  // calls with NaN coordinates simply draw nothing, so the failure mode is
  // "file reports success but the plate stays blank," with no error anyone
  // can act on. Reject it here instead, where the cause is still known.
  if (!(ppq > 0)) throw new MidiShapeError("Invalid MIDI file: ticks-per-quarter-note is zero.");

  let pos = 8 + view.getUint32(4);
  const tracks = [];
  const tempos = [];
  const timeSignatures = [];

  for (let ti = 0; ti < ntrks && pos + 8 <= buffer.byteLength; ti++) {
    if (str4(view, pos) !== "MTrk") break;
    const len = view.getUint32(pos + 4);
    const end = Math.min(buffer.byteLength, pos + 8 + len);
    let p = pos + 8;
    let tick = 0;
    let running = 0;
    let name = "";
    const open = new Map();
    const notes = [];
    const channels = new Set();

    while (p < end) {
      const dt = readVarInt(view, p); p = dt.next; tick += dt.value;
      let status = view.getUint8(p);
      if (status < 0x80) {
        if (!running) throw new MidiShapeError(`Data byte with no running status.`);
        status = running;
      } else {
        p++;
        running = status < 0xf0 ? status : 0;
      }

      if (status === 0xff) {
        const type = view.getUint8(p); p++;
        const ln = readVarInt(view, p); p = ln.next;
        const dataAt = p;
        if (type === 0x51 && ln.value === 3) {
          tempos.push({
            tick,
            usPerQuarter: (view.getUint8(dataAt) << 16) | (view.getUint8(dataAt + 1) << 8) | view.getUint8(dataAt + 2),
          });
        } else if (type === 0x58 && ln.value >= 2) {
          timeSignatures.push({
            tick, numerator: view.getUint8(dataAt),
            denominator: Math.pow(2, view.getUint8(dataAt + 1)),
          });
        } else if (type === 0x03) {
          name = readAscii(view, dataAt, ln.value);
        }
        p = dataAt + ln.value;
        if (type === 0x2f) break;
        continue;
      }

      if (status === 0xf0 || status === 0xf7) {
        const ln = readVarInt(view, p); p = ln.next + ln.value;
        continue;
      }

      const kind = status & 0xf0;
      const channel = status & 0x0f;
      if (kind === 0x90 || kind === 0x80) {
        const key = view.getUint8(p); const vel = view.getUint8(p + 1); p += 2;
        channels.add(channel);
        const id = channel * 128 + key;
        const isOnset = kind === 0x90 && vel > 0;
        if (isOnset) {
          if (open.has(id)) closeNote(open, notes, id, tick);
          open.set(id, { tick, midi: key, vel: vel / 127, channel });
        } else {
          closeNote(open, notes, id, tick);
        }
      } else if (kind === 0xa0 || kind === 0xb0 || kind === 0xe0) {
        p += 2;
      } else if (kind === 0xc0 || kind === 0xd0) {
        p += 1;
      }
    }
    for (const id of [...open.keys()]) closeNote(open, notes, id, tick + 1);

    tracks.push({ name, notes, channels: [...channels] });
    pos = pos + 8 + len;
  }

  return { format, ppq, tracks, tempos, timeSignatures };
}

function closeNote(open, notes, id, tick) {
  const on = open.get(id);
  if (!on) return;
  open.delete(id);
  notes.push({ tick: on.tick, durTick: Math.max(1, tick - on.tick), midi: on.midi, vel: on.vel, channel: on.channel });
}

function readVarInt(view, p) {
  let value = 0, byte;
  do { byte = view.getUint8(p++); value = (value << 7) | (byte & 0x7f); } while (byte & 0x80);
  return { value, next: p };
}
function str4(view, p) {
  return String.fromCharCode(view.getUint8(p), view.getUint8(p + 1), view.getUint8(p + 2), view.getUint8(p + 3));
}
function readAscii(view, p, len) {
  let s = "";
  for (let i = 0; i < len; i++) s += String.fromCharCode(view.getUint8(p + i));
  return s.trim();
}

function medianPitch(notes) {
  if (notes.length === 0) return 0;
  const sorted = notes.map((n) => n.midi).sort((a, b) => a - b);
  const mid = sorted.length >> 1;
  return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
}

/**
 * Pure contrapuntal voice naming: a track's own embedded MIDI name is only
 * trusted when it actually reads as a voice name. DAW export slots ("Track
 * 3", "Channel 2") and organ registration stops ("Org.1", "Ped Stop-C") are
 * neither -- they are the instrument's or the sequencer's own bookkeeping,
 * never a name a copyist would have written on a part. Anything matching
 * this is discarded in favour of the classic contrapuntal names, assigned
 * top to bottom by pitch once the voices are already ordered by median
 * register (see ingestMidi).
 */
const TECHNICAL_LABEL_RE = /\b(org(an)?\.?\s*#?\d*|ped(al)?\.?\s*(stop)?[\s-]*[a-z0-9]*|stop[\s-]*[a-z0-9]*|track\s*#?\d*|channel\s*#?\d*|midi\s*#?\d*|instrument\s*#?\d*|patch\s*#?\d*|part\s*#?\d+|untitled)\b/i;

function isTechnicalLabel(name) {
  const s = String(name || "").trim();
  if (!s) return true;
  if (TECHNICAL_LABEL_RE.test(s)) return true;
  // A bare short code plus a number ("Trk1", "Ch2", "Vc.3") reads as an
  // instrument-patch or DAW track slot, not a voice a copyist ever wrote.
  return /^[A-Za-z]{1,5}\.?\s*#?\d+$/.test(s);
}

// The organ-and-pedal-aware five-name set. Used whenever any track's own
// label reads as technical (a strong signal this file came off an organ
// console or a DAW export rather than a hand-labelled score) -- "Pedal"
// rather than "Quintus" for a real fifth voice at the bottom of an organ
// texture.
const CONTRAPUNTAL_NAMES = ["Soprano", "Alto", "Tenor", "Bass", "Pedal"];
const contrapuntalLabel = (i) => CONTRAPUNTAL_NAMES[i] || `Voice ${i + 1}`;

function ingestMidi(buffer, opts) {
  opts = opts || {};
  let smf;
  try {
    smf = readSmf(buffer);
  } catch (err) {
    if (err instanceof MidiShapeError) throw err;
    throw new MidiShapeError(`Could not parse MIDI (${err && err.message}).`);
  }

  const voiced = smf.tracks.filter((t) => t.notes.length > 0);
  if (voiced.length === 0) throw new MidiShapeError("No notes found in file.");

  let layers = voiced;
  if (voiced.length === 1 && voiced[0].channels.length > 1) {
    const split = voiced[0].channels
      .map((ch) => ({
        name: `Channel ${ch}`,
        notes: voiced[0].notes.filter((n) => n.channel === ch),
        channels: [ch],
      }))
      .filter((l) => l.notes.length > 0);
    if (split.length > 1) layers = split;
  }

  const singleLayer = layers.length === 1;
  // Ordered by MEDIAN pitch rather than mean: a voice that briefly leaps into
  // an extreme register (a passing high note, a low pedal point) shouldn't
  // drag its whole-piece average past a neighbouring voice's. Median is far
  // less sensitive to that kind of short excursion.
  //
  // This is still fundamentally a statistical guess, not a structural fact,
  // and it has a real limit: genuine voice-crossing -- alto and tenor lines
  // that trade register for a passage, a hallmark of exactly the invertible
  // counterpoint Bach writes constantly -- can leave two voices' medians on
  // the "wrong" side of each other. There is no way to resolve that without
  // real voice-separation analysis (tracking which line is contrapuntally
  // continuous through a crossing, not just where notes sit on average).
  const ordered = layers
    .map((t) => ({ t, med: medianPitch(t.notes) }))
    .sort((a, b) => b.med - a.med)
    .map((x) => x.t);

  // A piece-wide signal, not a per-track one: if ANY track's own name reads
  // as technical, the whole file most likely came from an organ console or
  // a DAW rather than a hand-labelled score, so every voice that needs a
  // fallback name uses the same naming convention rather than mixing
  // "Soprano" with "Quintus" depending on which particular track happened
  // to carry a clean name.
  const anyTechnical = ordered.some((t) => t.name && isTechnicalLabel(t.name));

  const voices = ordered.map((track, i) => {
    const supplied = opts.labels && opts.labels[i];
    const usable = track.name && !isTechnicalLabel(track.name) ? track.name : null;
    const fallback = singleLayer
      ? "All voices"
      : (anyTechnical ? contrapuntalLabel(i) : labelForIndex(i));
    return {
      label: supplied || usable || fallback,
      notes: track.notes.map((n) => ({ tick: n.tick, durTick: n.durTick, midi: n.midi, vel: n.vel })),
    };
  });

  const score = buildScore({
    name: opts.name || "Untitled",
    ppq: smf.ppq,
    tempos: smf.tempos,
    timeSignatures: smf.timeSignatures,
    voices,
  });

  return {
    score,
    diagnostics: {
      format: smf.format,
      trackCount: smf.tracks.length,
      voicedTrackCount: layers.length,
      voiceCount: score.voices.length,
      noteCount: score.noteCount,
      ppq: smf.ppq,
      singleLayer,
    },
  };
}

function validateScore(score) {
  let maxRoundTripTicks = 0, maxBreakpointDev = 0, maxDurationTicks = 0, notes = 0;
  for (const voice of score.voices) {
    for (const n of voice.notes) {
      notes++;
      const back = secToTick(score.tempoMap, score.ppq, n.startSec);
      maxRoundTripTicks = Math.max(maxRoundTripTicks, Math.abs(back - n.startTick));
      // The old check only round-tripped startSec/startTick. A tempo-map bug
      // that specifically corrupted DURATIONS (rather than onsets) -- for
      // instance an off-by-one in how a tempo change mid-note is integrated
      // -- could pass every previous check while still playing every note
      // for the wrong length.
      const endBack = secToTick(score.tempoMap, score.ppq, n.endSec);
      const endTick = n.startTick + n.durTick;
      maxDurationTicks = Math.max(maxDurationTicks, Math.abs(endBack - endTick));
    }
  }
  for (const p of score.tempoMap) {
    maxBreakpointDev = Math.max(maxBreakpointDev, Math.abs(tickToSec(score.tempoMap, score.ppq, p.tick) - p.sec));
  }
  return {
    notes,
    voices: score.voices.map((v) => v.notes.length).join("/"),
    durSec: +score.durSec.toFixed(4),
    maxRoundTripTicks,
    maxDurationTicks,
    maxBreakpointDev,
    ok: maxRoundTripTicks < 1e-3 && maxDurationTicks < 1e-3 && maxBreakpointDev < 1e-9,
  };
}

/* ==========================================================================
 * 5. MOTIF MATCHER
 * ========================================================================== */

const MOTIF = { EPISODE: 0, SUBJECT: 1, ANSWER: 2, COUNTERSUBJECT: 3 };
const MOTIF_NAME = { 0: "episode", 1: "subject", 2: "answer", 3: "countersubject" };

const MOTIF_TUNING = {
  intervalBudget: 2, maxDeviantPositions: 2, rhythmTolerance: 0.22,
  maxRhythmViolations: 1, minCompleteness: 0.6, maxPatternNotes: 24,
};

function analyze(score, tuning) {
  const cfg = Object.assign({}, MOTIF_TUNING, tuning || {});
  const total = score.noteCount;
  const empty = {
    subject: null, countersubject: null, occurrences: [],
    motifOf: new Uint8Array(total), occurrenceOf: new Int32Array(total).fill(-1),
    byTime: [], handoffs: [], spans: [],
  };

  const entries = score.voices
    .filter((v) => v.notes.length > 0)
    .map((v) => ({ voice: v, at: v.notes[0].startSec }))
    .sort((a, b) => a.at - b.at);
  if (entries.length < 2) return empty;

  const first = entries[0].voice;
  const secondEntry = entries[1].at;

  const subjectCount = takeUntil(first.notes, 0, secondEntry, cfg.maxPatternNotes);
  if (subjectCount < 4) return empty;
  const subject = patternFrom(first.notes, 0, subjectCount);

  const csStart = indexAtOrAfter(first.notes, secondEntry);
  const csLimit = entries[2] ? entries[2].at : Infinity;
  const csCount = takeUntil(first.notes, csStart, csLimit, cfg.maxPatternNotes);
  const countersubject = csCount >= 4 ? patternFrom(first.notes, csStart, csCount) : null;

  const candidates = [];
  for (const voice of score.voices) {
    collect(candidates, voice.id, voice.notes, subject, cfg, false, null);
    collect(candidates, voice.id, voice.notes, subject, cfg, true, null);
    if (countersubject) collect(candidates, voice.id, voice.notes, countersubject, cfg, false, MOTIF.COUNTERSUBJECT);
  }

  const occurrences = selectNonOverlapping(candidates, score);
  const notesByVoice = new Map(score.voices.map((v) => [v.id, v.notes]));

  const motifOf = new Uint8Array(total);
  const occurrenceOf = new Int32Array(total).fill(-1);
  occurrences.forEach((occ, i) => {
    const notes = notesByVoice.get(occ.voiceId);
    if (!notes) return;
    for (let j = lowerBoundSec(notes, occ.startSec); j < notes.length; j++) {
      const n = notes[j];
      if (n.startSec > occ.endSec + 1e-9) break;
      motifOf[n.id] = occ.type;
      occurrenceOf[n.id] = i;
    }
  });

  const byTime = [...occurrences].sort((a, b) => a.startSec - b.startSec);
  return {
    subject, countersubject, occurrences, motifOf, occurrenceOf, byTime,
    spans: mergeSpans(byTime),
  };
}

function mergeSpans(byTime) {
  const spans = [];
  for (let i = 0; i < byTime.length; i++) {
    const o = byTime[i];
    const last = spans.length ? spans[spans.length - 1] : null;
    if (last && o.startSec <= last.end + 1e-6) {
      if (o.endSec > last.end) last.end = o.endSec;
    } else {
      spans.push({ start: o.startSec, end: o.endSec });
    }
  }
  return spans;
}

function patternFrom(notes, from, count) {
  const intervals = [], iois = [];
  for (let i = 0; i < count - 1; i++) {
    const a = notes[from + i], b = notes[from + i + 1];
    intervals.push(b.midi - a.midi);
    iois.push(Math.max(1e-4, b.startSec - a.startSec));
  }
  const unit = iois[0] || 1;
  return {
    intervals,
    ioiRatios: iois.map((x) => x / unit),
    baseMidi: notes[from].midi,
    noteCount: count,
  };
}

function takeUntil(notes, from, limitSec, cap) {
  let n = 0;
  while (from + n < notes.length && n < cap && notes[from + n].startSec < limitSec - 1e-6) n++;
  return n;
}
function indexAtOrAfter(notes, sec) {
  let i = 0;
  while (i < notes.length && notes[i].startSec < sec - 1e-6) i++;
  return i;
}
function lowerBoundSec(notes, sec) {
  let lo = 0, hi = notes.length;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (notes[mid].startSec < sec - 1e-9) lo = mid + 1; else hi = mid;
  }
  return lo;
}

function collect(out, voiceId, notes, pattern, cfg, inverted, forceType) {
  const k = pattern.intervals.length;
  if (k < 3) return;
  const minK = Math.max(3, Math.ceil(k * cfg.minCompleteness));
  for (let start = 0; start + minK < notes.length; start++) {
    const m = matchAt(notes, start, pattern, cfg, inverted, minK);
    if (!m) continue;
    const transposition = notes[start].midi - pattern.baseMidi;
    const type = forceType != null ? forceType : classifyEntry(transposition);
    const cost = m.cost + (inverted ? 0.4 : 0) + (1 - m.matched / k);
    out.push({
      id: `${voiceId}:${start}:${inverted ? "i" : "p"}:${type}`,
      voiceId, type, transposition, inverted,
      completeness: m.matched / k,
      startSec: notes[start].startSec,
      endSec: notes[start + m.matched].endSec,
      startIndex: start,
      endIndex: start + m.matched,
      cost,
      confidence: Math.max(0, Math.min(1, (1 - Math.min(1, cost * 0.8)) * (m.matched / k))),
    });
  }
}

function matchAt(notes, start, pattern, cfg, inverted, minK) {
  const sign = inverted ? -1 : 1;
  const k = Math.min(pattern.intervals.length, notes.length - start - 1);
  if (k < minK) return null;

  let deviation = 0, deviantPositions = 0, rhythmViolations = 0, cost = 0, firstIoi = 0, matched = 0;
  for (let i = 0; i < k; i++) {
    const a = notes[start + i], b = notes[start + i + 1];
    const d = Math.abs(b.midi - a.midi - sign * pattern.intervals[i]);
    if (d > 0) {
      deviation += d; deviantPositions++;
      if (deviation > cfg.intervalBudget || deviantPositions > cfg.maxDeviantPositions) break;
    }
    const ioi = Math.max(1e-4, b.startSec - a.startSec);
    if (i === 0) firstIoi = ioi;
    const rhythmErr = Math.abs(Math.log2(ioi / firstIoi / pattern.ioiRatios[i]));
    if (rhythmErr > cfg.rhythmTolerance && ++rhythmViolations > cfg.maxRhythmViolations) break;
    cost += d * 0.5 + Math.min(rhythmErr, 1);
    matched = i + 1;
  }
  if (matched < minK) return null;
  return { matched, cost: cost / matched };
}

function classifyEntry(transposition) {
  const pc = ((transposition % 12) + 12) % 12;
  if (pc === 0) return MOTIF.SUBJECT;
  if (pc === 7 || pc === 5) return MOTIF.ANSWER;
  return MOTIF.SUBJECT;
}

function selectNonOverlapping(candidates, score) {
  const ranked = [...candidates].sort((a, b) => a.cost - b.cost || a.startSec - b.startSec);
  const taken = new Map(score.voices.map((v) => [v.id, []]));
  const accepted = [];
  for (const cand of ranked) {
    const list = taken.get(cand.voiceId);
    if (!list) continue;
    if (list.some((o) => cand.startSec < o.endSec - 1e-6 && o.startSec < cand.endSec - 1e-6)) continue;
    list.push(cand);
    accepted.push(cand);
  }
  return accepted.sort((a, b) => a.startSec - b.startSec || a.voiceId - b.voiceId);
}

/* ==========================================================================
 * 6. KRUMHANSL-KESSLER TONALITY
 * ========================================================================== */

const KK_MAJOR = [6.35, 2.23, 3.48, 2.33, 4.38, 4.09, 2.52, 5.19, 2.39, 3.66, 2.29, 2.88];
const KK_MINOR = [6.33, 2.68, 3.52, 5.38, 2.60, 3.53, 2.54, 4.75, 3.98, 2.69, 3.34, 3.17];
const PC_NAMES = ["C", "C\u266F", "D", "E\u266D", "E", "F", "F\u266F", "G", "A\u266D", "A", "B\u266D", "B"];

function estimateKey(score) {
  const weights = new Array(12).fill(0);
  let total = 0;
  for (const voice of score.voices) {
    for (const n of voice.notes) {
      const d = n.endSec - n.startSec;
      weights[((n.midi % 12) + 12) % 12] += d;
      total += d;
    }
  }
  if (total <= 0) return null;

  let best = null, second = -Infinity;
  for (let tonic = 0; tonic < 12; tonic++) {
    for (const mode of ["major", "minor"]) {
      const profile = mode === "major" ? KK_MAJOR : KK_MINOR;
      const rotated = profile.map((_, i) => profile[(i - tonic + 120) % 12]);
      const r = pearson(weights, rotated);
      if (!best || r > best.confidence) {
        if (best) second = best.confidence;
        best = { tonic, mode, confidence: r, margin: 0, label: `${PC_NAMES[tonic]} ${mode}` };
      } else if (r > second) second = r;
    }
  }
  return best ? Object.assign({}, best, { margin: best.confidence - second }) : null;
}

function pearson(a, b) {
  const ma = a.reduce((s, x) => s + x, 0) / a.length;
  const mb = b.reduce((s, x) => s + x, 0) / b.length;
  let num = 0, da = 0, db = 0;
  for (let i = 0; i < a.length; i++) {
    const x = a[i] - ma, y = b[i] - mb;
    num += x * y; da += x * x; db += y * y;
  }
  const den = Math.sqrt(da * db);
  return den === 0 ? 0 : num / den;
}

/* ==========================================================================
 * 7. GLYPH GEOMETRY (Graceful Cantilena Contour Fallback)
 * ========================================================================== */

const MATRIX_COLUMNS = 56;

function buildGlyph(score, analysis) {
  return contourGlyph(score, analysis) || matrixGlyph(score);
}

function contourGlyph(score, analysis) {
  let notes = null;
  let voiceId = 0;
  let caption = "Melodic Contour";

  // Scenario A: Staggered fugal entry detected
  if (analysis && analysis.subject && analysis.byTime.length > 0) {
    const dux = analysis.byTime[0];
    const voice = score.voices.find((v) => v.id === dux.voiceId);
    if (voice) {
      notes = voice.notes.filter((n) => n.startSec >= dux.startSec - 1e-9 && n.startSec <= dux.endSec + 1e-9);
      voiceId = voice.id;
      caption = `Subject — ${voice.label}`;
    }
  }

  // Scenario B: Homophonic opening (e.g. Goldberg Aria) — take the singing soprano theme
  if (!notes || notes.length < 3) {
    const topVoice = score.voices[0];
    if (topVoice && topVoice.notes.length >= 3) {
      const maxSec = score.measures && score.measures.length >= 4 ? score.measures[3].startSec : topVoice.notes[0].startSec + 8;
      notes = topVoice.notes.filter((n) => n.startSec <= maxSec).slice(0, 16);
      if (notes.length < 3) notes = topVoice.notes.slice(0, Math.min(16, topVoice.notes.length));
      voiceId = topVoice.id;
      caption = `Theme — ${topVoice.label}`;
    }
  }

  if (!notes || notes.length < 3) return null;

  const t0 = notes[0].startSec;
  const span = Math.max(1e-6, notes[notes.length - 1].endSec - t0);
  const lo = Math.min(...notes.map((n) => n.midi));
  const hi = Math.max(...notes.map((n) => n.midi));
  const range = Math.max(1, hi - lo);
  const medianDur = median(notes.map((n) => n.endSec - n.startSec));

  return {
    kind: "contour",
    points: notes.map((n, i) => ({
      u: (n.startSec - t0) / span,
      v: (n.midi - lo) / range,
      midi: n.midi, sec: n.startSec,
      pivot: classifyPivot(notes, i, medianDur),
    })),
    cells: [], rows: score.voices.length, voiceId,
    caption,
  };
}

function classifyPivot(notes, i, medianDur) {
  const prev = notes[i - 1], next = notes[i + 1], cur = notes[i];
  if (prev && Math.abs(cur.midi - prev.midi) >= 3) return "leap";
  if (next && Math.abs(next.midi - cur.midi) >= 3) return "leap";
  if (cur.endSec - cur.startSec >= medianDur * 1.75) return "suspension";
  if (prev && next) {
    const a = Math.sign(cur.midi - prev.midi), b = Math.sign(next.midi - cur.midi);
    if (a !== 0 && b !== 0 && a !== b) return "turn";
  }
  return "none";
}

function matrixGlyph(score) {
  const cells = [];
  const dur = Math.max(1e-6, score.durSec);
  const colSec = dur / MATRIX_COLUMNS;
  score.voices.forEach((voice, row) => {
    const counts = new Array(MATRIX_COLUMNS).fill(0);
    for (const n of voice.notes) counts[Math.min(MATRIX_COLUMNS - 1, Math.floor(n.startSec / colSec))]++;
    const peak = Math.max(1, ...counts);
    counts.forEach((count, c) => {
      if (count > 0) cells.push({ u: c / MATRIX_COLUMNS, row, density: count / peak });
    });
  });
  return {
    kind: "matrix", points: [], cells,
    rows: Math.max(1, score.voices.length), voiceId: null,
    caption: "Voice topography",
  };
}

function median(xs) {
  if (!xs.length) return 1;
  const s = [...xs].sort((a, b) => a - b), mid = s.length >> 1;
  return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
}

/* ==========================================================================
 * 8. MONOGRAM CONTENT (Intelligent BWV & Cantabile Detection)
 * ========================================================================== */

function extractCatalogue(name) {
  const s = String(name || "");
  const mBwv = /\bBWV\.?[\s_-]*(\d+[a-z]?)\b/i.exec(s);
  if (mBwv) return `BWV ${mBwv[1]}`;
  const mNum = /\b(988|84[6-9]|8[5-9]\d|10\d{2}|[1-9]\d{2})\b/i.exec(s);
  if (mNum) return `BWV ${mNum[1]}`;
  return null;
}

/**
 * Known nicknames for named Bach works, keyed by the bare word a filename
 * tends to carry (lowercased, whitespace-normalised) and mapped to the
 * form a real programme note would use. Anything not in this small list
 * still gets a nickname -- just title-cased as written rather than
 * expanded with "The" -- so an unrecognised name is never dropped, only
 * left unembellished.
 */
const WORK_NICKNAMES = {
  great: "The Great", little: "The Little", giant: "The Giant",
  wedge: "The Wedge", dorian: "The Dorian", cathedral: "The Cathedral",
  jig: "The Jig Fugue", "st anne": "St Anne", stanne: "St Anne",
  "wachet auf": "Wachet auf", easter: "The Easter",
};

/**
 * A nickname is set off from the rest of a filename the way a copyist sets
 * one off in prose: in parentheses, or -- the common raw-export equivalent
 * -- behind a run of two or more underscores, trailing to the end of the
 * name. Either form is pulled out here, BEFORE the generic slug cleanup
 * below runs, so it never gets swallowed as just another underscore-word
 * and lost.
 */
function extractNickname(raw) {
  let s = String(raw || "");
  let nickname = null;
  const paren = /\(([^)]+)\)/.exec(s);
  if (paren) {
    nickname = paren[1].trim();
    s = s.slice(0, paren.index) + s.slice(paren.index + paren[0].length);
  } else {
    const under = /_{2,}([A-Za-z][A-Za-z'\- ]*?)_*$/.exec(s);
    if (under) {
      nickname = under[1].trim();
      s = s.slice(0, under.index) + s.slice(under.index + under[0].length);
    }
  }
  if (nickname) {
    const key = nickname.toLowerCase().replace(/\s+/g, " ").trim();
    nickname = WORK_NICKNAMES[key] || (nickname[0].toUpperCase() + nickname.slice(1).toLowerCase());
  }
  return { rest: s, nickname };
}

// Small connecting words stay lowercase mid-title -- "Fugue in C minor," not
// "Fugue In C Minor."
const TITLE_MINOR_WORDS = new Set(["a", "an", "and", "as", "at", "but", "by", "for", "in", "nor", "of", "on", "or", "the", "to", "v", "via"]);

function titleCaseWork(s) {
  const words = s.split(" ").filter(Boolean);
  return words.map((w, i) => {
    const lw = w.toLowerCase();
    if (i > 0 && i < words.length - 1 && TITLE_MINOR_WORDS.has(lw)) return lw;
    return w[0].toUpperCase() + w.slice(1).toLowerCase();
  }).join(" ");
}

/**
 * Fully automatic title formatting -- zero manual cleanup ever required.
 * A raw export like "Johann_Sebastian_Bach_-_Fugue_BWV_542__Great_.mid" is
 * walked through, in order: extension stripped, any nickname pulled out
 * and set aside (see extractNickname), the composer's name discarded in
 * every common form ("Johann Sebastian Bach", "J.S. Bach", bare "Bach"),
 * the catalogue number discarded (extractCatalogue reads it separately, so
 * losing it here costs nothing), underscores and dashes collapsed to
 * spaces, and what remains gently title-cased. A bare "fugue18"-style slug
 * is rebuilt into a properly punctuated ordinal ("Fugue No. 18") rather
 * than ever printed raw. The result is never a filename fragment, a track
 * count, or a ".mid" extension -- only a title a copyist could have
 * written by hand, in dignified Title Case, never screaming capitals.
 */
function cleanTitle(name) {
  const raw = String(name || "").replace(/\.(mid|midi)$/i, "");
  const { rest, nickname } = extractNickname(raw);

  let s = rest
    .replace(/[_-]+/g, " ")
    .replace(/\bJohann\s+Sebastian\s+Bach\b/gi, " ")
    .replace(/\bJ\.?\s*S\.?\s*Bach\b/gi, " ")
    .replace(/\bBach\b/gi, " ")
    .replace(/\s*\bBWV\.?\s*\d+[a-z]?\b\s*/gi, " ")
    .replace(/\b988\b/g, " ")
    .replace(/\s{2,}/g, " ")
    .trim();

  if (!s) {
    s = "Untitled";
  } else {
    const mSlug = /^(fugue|prelude|invention|sinfonia|aria|gigue|allemande|courante|sarabande|minuet|canon|toccata|fantasia|chorale)\s*(\d+)$/i.exec(s);
    if (mSlug) {
      const word = mSlug[1][0].toUpperCase() + mSlug[1].slice(1).toLowerCase();
      s = `${word} No. ${mSlug[2]}`;
    } else {
      s = titleCaseWork(s);
    }
  }

  return nickname ? `${s} ('${nickname}')` : s;
}

function buildMonogram(score, analysis, hints) {
  hints = hints || {};
  const key = estimateKey(score);
  const voices = score.voices.length;
  const count = `${voices} ${voices === 1 ? "Voice" : "Voices"}`;
  
  let architecture = `${count} / Cantabile`;
  if (analysis && analysis.subject) {
    const answers = analysis.occurrences.filter((o) => o.type === MOTIF.ANSWER).length;
    architecture = `${count} / ${answers > 0 ? "Strict Counterpoint" : "Imitative Counterpoint"}`;
  } else if (score.measures && score.measures.length > 0) {
    architecture = `${count} / Polyphonic Setting`;
  }

  return {
    title: hints.title || cleanTitle(score.name),
    catalogue: hints.catalogue || extractCatalogue(score.name) || "\u2014",
    architecture,
    tonality: key ? key.label + (key.margin < 0.05 ? " (ambiguous)" : "") : "\u2014",
    measures: score.measures.length > 0 ? `${score.measures.length} bars` : "\u2014",
    glyph: buildGlyph(score, analysis),
  };
}

/* ==========================================================================
 * 9. VIEW — Calibrated Spatial Dimensions & Commanding Pitch Lanes
 * ========================================================================== */

const PHI = 1.6180339887498948;
const PLATE = { width: 1200, height: 675, minWidth: 1200 };

function plateFit(viewportW, viewportH) {
  const scale = Math.min(viewportW / PLATE.width, viewportH / PLATE.height);
  return {
    scale,
    offsetX: (viewportW - PLATE.width * scale) / 2,
    offsetY: (viewportH - PLATE.height * scale) / 2,
  };
}

/**
 * The Shorts (9:16) fit: COVER rather than CONTAIN, centered on the
 * playhead rather than the plate's own midpoint.
 *
 * Cover, because a 9:16 box is far narrower than the 16:9 plate -- fitting
 * by containment would show the whole plate shrunk into a small strip with
 * huge empty bars, not an "intimate vertical framing." Covering scales the
 * plate up until its height fills the box, deliberately letting most of its
 * width run outside the frame.
 *
 * Centered on the playhead rather than the midpoint, because once the plate
 * is wider than the visible box, "centered" has to mean something -- and
 * centering on the piece's timeline midpoint would show a fixed slice near
 * the middle of the piece, drifting further from what is actually sounding
 * the longer playback runs. The playhead already tracks exactly where the
 * active voice-leading is; reusing its own position as the crop's anchor
 * needs no separate "smart tracking" logic of its own.
 */
function plateFitCover(viewportW, viewportH, playheadX) {
  const scale = Math.max(viewportW / PLATE.width, viewportH / PLATE.height);
  return {
    scale,
    offsetY: (viewportH - PLATE.height * scale) / 2,
    offsetX: viewportW / 2 - playheadX * scale,
  };
}

/** The playhead's x position in PLATE-space -- fixed, independent of score,
 * dpr, or on-screen scale, since it is derived purely from the plate's own
 * constant margins and the golden playheadRatio. Kept as one small shared
 * function so the cover-fit calculation (which needs it before layoutView
 * can run) and layoutView itself can never drift apart. */
function platePlayheadX(playheadRatio) {
  const marginX = Math.round(PLATE.width * 0.06);
  const innerW = PLATE.width - marginX * 2;
  return marginX + Math.round(innerW * (playheadRatio == null ? 0.381966 : playheadRatio));
}

/**
 * Immersive framing, with one hard priority above it: substantial note
 * mass. Margins are cut to ~6-8% of the plate so the musical lines fill the
 * frame with real presence -- an intimate illuminated page, not a plate
 * mounted behind glass -- and a bottom-heavier-than-top ratio (1.35x) keeps
 * an optical-mount asymmetry. But a wide-compass score (BWV 542-style,
 * 5+ octaves) can shrink `innerH / span` well under the height a single
 * 15.2px slug plus its own lane gap actually needs; when that happens, the
 * row grid grows to that floor INSTEAD of continuing to compress notes into
 * fragile ribbons, and the musical field expands symmetrically past the
 * nominal margins to make room, right up to a hard, always-respected
 * clearance (`HARD_PAD_TOP`/`HARD_PAD_BOTTOM` -- enough room for the voice
 * legend and bar numbers above, a sliver of paper below). Ordinary 2-3
 * octave pieces never trigger this at all: `innerH / span` already clears
 * the floor, so rowH/top/bottom come out identical to the un-recalibrated
 * version. For the rare score wide enough that even the hard clearance
 * cannot fit `MIN_ROW_H` per semitone, drawVoiceNotes's own STROKE.minWeight
 * floor (section 10) still applies unconditionally to the rendered note
 * height regardless of how far rowH itself had to compress -- weighty,
 * tactile strokes are guaranteed at the note level even in that edge case,
 * independent of what the row grid above could geometrically afford.
 *
 * Cadence pull-back: `pullBack` (0..1) widens every margin by up to 15%
 * during the piece's final measure and reverb tail -- a slow, stately
 * opening-up that reveals more of the surrounding vellum right as the
 * music itself settles. This only affects the nominal (non-wide-compass)
 * margins; a piece wide enough to already be running against the hard
 * clearance has nothing left to give pull-back room to open into, which is
 * an acceptable, rare trade-off against never compressing the voice-leading
 * itself.
 */
function layoutView(score, dpr, pxPerSec, playheadRatio, pullBack) {
  const span = Math.max(10, score.pitchHi - score.pitchLo);
  const width = PLATE.width, height = PLATE.height;
  const pullFactor = 1 + Math.max(0, Math.min(1, pullBack || 0)) * 0.15;
  const marginX = Math.round(width * 0.06 * pullFactor);
  const marginTop = Math.round(height * 0.068 * pullFactor);
  const marginBottom = Math.round(marginTop * 1.35);
  const innerW = Math.max(40, width - marginX * 2);
  const nominalInnerH = Math.max(24, height - marginTop - marginBottom);

  const MIN_ROW_H = STROKE.minWeight + STROKE.laneGap;
  const HARD_PAD_TOP = 30, HARD_PAD_BOTTOM = 10;
  const maxContentH = Math.max(1, height - HARD_PAD_TOP - HARD_PAD_BOTTOM);
  const naturalRowH = nominalInnerH / span;
  const rowH = Math.min(Math.max(MIN_ROW_H, naturalRowH), maxContentH / span);
  const contentH = rowH * span;

  let top, bottom;
  if (contentH <= nominalInnerH + 0.01) {
    top = marginTop;
    bottom = marginTop + nominalInnerH;
  } else {
    const centerY = HARD_PAD_TOP + maxContentH / 2;
    top = centerY - contentH / 2;
    bottom = centerY + contentH / 2;
  }

  return {
    width, height, dpr, pxPerSec,
    left: marginX, right: marginX + innerW,
    top, bottom,
    innerW, innerH: contentH,
    rowH,
    // The golden division (1 - 1/phi): a mathematically exact split between
    // "history" and "what's coming," not an approximation of one.
    playheadX: marginX + Math.round(innerW * (playheadRatio == null ? 0.381966 : playheadRatio)),
    pitchTop: score.pitchHi,
    pitchBottom: score.pitchHi - span,
  };
}
const xOfSec = (v, sec, t) => (sec - t) * v.pxPerSec + v.playheadX;
const secOfX = (v, x, t) => (x - v.playheadX) / v.pxPerSec + t;
const yOfMidi = (v, midi) => v.top + (v.pitchTop - midi) * v.rowH;

function visibleWindow(v, t, into) {
  into.start = (v.left - 60 - v.playheadX) / v.pxPerSec + t;
  into.end = (v.right + 60 - v.playheadX) / v.pxPerSec + t;
  return into;
}

/* ==========================================================================
 * 10. RENDERING LAYERS & URTEXT MEASURE NUMBERING
 * ========================================================================== */

let THEME = environmentFor(activeTheme);

function drawPaper(ctx, score, v, paper, showRules, canvas) {
  if (canvas) {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
  } else {
    ctx.clearRect(0, 0, v.width, v.height);
  }
  if (paper) ctx.drawImage(paper, 0, 0, v.width, v.height);
  else { ctx.fillStyle = THEME.paper; ctx.fillRect(0, 0, v.width, v.height); }
  if (!showRules) return;

  const dpr = v.dpr || 1;
  const half = 0.5 / dpr;

  // Clean octave guidelines: the ONLY background pitch-guide lines on the
  // whole plate are the true octave (C-note) lines, restricted to C1
  // through C6 -- no minor sub-lines, no clutter beyond the piece's most
  // readable register span -- at a whisper-quiet 8% opacity.
  ctx.strokeStyle = THEME.ruleOctave;
  ctx.lineWidth = 0.5 / dpr;
  ctx.beginPath();
  for (let m = v.pitchBottom; m <= v.pitchTop; m++) {
    if (m % 12 !== 0) continue;
    const octaveNum = Math.floor(m / 12) - 1;
    if (octaveNum < 1 || octaveNum > 6) continue;
    const y = snap(yOfMidi(v, m), dpr) + half;
    ctx.moveTo(v.left, y);
    ctx.lineTo(v.right, y);
  }
  ctx.stroke();

  ctx.fillStyle = THEME.label;
  ctx.font = THEME.labelFont;
  ctx.textBaseline = "middle";
  for (let m = v.pitchBottom; m <= v.pitchTop; m++) {
    if (m % 12 !== 0) continue;
    const octaveNum = Math.floor(m / 12) - 1;
    if (octaveNum < 1 || octaveNum > 6) continue;
    ctx.fillText(`C${octaveNum}`, v.left - 28, snap(yOfMidi(v, m), dpr));
  }
}

function drawRules(ctx, score, v, t, windowStart, windowEnd) {
  const measures = score.measures;
  if (measures.length === 0) return;
  const dpr = v.dpr || 1;
  const half = 0.5 / dpr;

  // Major phrase boundary rules (every 4 bars) with Urtext measure numbering
  ctx.lineWidth = 0.5 / dpr;
  ctx.strokeStyle = THEME.ruleBarMajor;
  ctx.beginPath();
  for (let i = 0; i < measures.length; i++) {
    const m = measures[i];
    if (m.startSec < windowStart) continue;
    if (m.startSec > windowEnd) break;
    if (m.index % 4 === 0) {
      const x = snap(xOfSec(v, m.startSec, t), dpr) + half;
      ctx.moveTo(x, v.top);
      ctx.lineTo(x, v.bottom);
    }
  }
  ctx.stroke();

  // Fine Urtext Measure Numbers above the top ruling boundary
  ctx.font = THEME.barNumberFont;
  ctx.fillStyle = THEME.ruleNumber;
  ctx.textAlign = "center";
  ctx.textBaseline = "bottom";
  for (let i = 0; i < measures.length; i++) {
    const m = measures[i];
    if (m.startSec < windowStart) continue;
    if (m.startSec > windowEnd) break;
    if (m.index % 4 === 0 && m.index > 0) {
      const x = snap(xOfSec(v, m.startSec, t), dpr);
      ctx.fillText(String(m.index + 1), x, v.top - 3);
    }
  }

  // Subtle minor barline ticks at margin boundaries
  ctx.strokeStyle = THEME.ruleBarTick;
  ctx.beginPath();
  for (let i = 0; i < measures.length; i++) {
    const m = measures[i];
    if (m.startSec < windowStart) continue;
    if (m.startSec > windowEnd) break;
    if (m.index % 4 !== 0) {
      const x = snap(xOfSec(v, m.startSec, t), dpr) + half;
      ctx.moveTo(x, v.top);
      ctx.lineTo(x, v.top + 6);
      ctx.moveTo(x, v.bottom - 6);
      ctx.lineTo(x, v.bottom);
    }
  }
  ctx.stroke();
}

/**
 * Absolute, uniform note mass -- not fragile ribbons, and not a
 * register-scaled gradient either.
 *
 * `weight` and `minWeight` are now the SAME fixed value (15.2px), rendered
 * unconditionally for every note in drawVoiceNotes regardless of voice,
 * register, or how a wide-compass score would otherwise want to compress
 * lane height: every note on the plate shares identical physical stature.
 * Recalibrated down from an earlier 19px so close scale steps (2nds) keep
 * clean daylight between adjacent strokes without ever reading as thin.
 * layoutView's own MIN_ROW_H recalibration (see section 9) is derived from
 * this same constant, so it automatically grows in step -- the two work
 * together, not one instead of the other.
 */
const STROKE = {
  weight: 15.2,
  minWeight: 15.2,
  laneGap: 2.3,
  radius: 1.7,
  grain: 0.35,
  minLength: 4.5,
};

/**
 * Unison vertical offset: how far each voice's own centre is nudged off
 * the shared pitch centreline when two different voices sound the exact
 * same pitch at once (see analyzeNoteCollisions / drawVoiceNotes). Kept
 * small relative to STROKE.weight so most of each voice's own 15.2px
 * stature still sits outside the shared, blended middle band.
 */
const UNISON_OFFSET = 2.8;

/**
 * A stamped rectangular bar, not a calligraphic stroke.
 *
 * A prior pass tapered both ends toward a point -- "a broad-nib pen's
 * pressure curve" -- and at any real note length that taper reads exactly as
 * what it geometrically is: a canoe, a leaf, an arrowhead. A woodblock print
 * does not do that. A carved rectangular slug is inked and stamped; its ends
 * are a flat vertical cut where the block itself simply stops, not a
 * hand-lifted point. So: x0 and x1 are true flat vertical edges, full body
 * width all the way to the corner, with only a small radius (STROKE.radius)
 * softening the four corners themselves -- worn tool marks, not narrowing.
 *
 * The organic imperfection survives, but it is relocated to where a real
 * carved block actually shows its hand: a faint wobble ALONG the top and
 * bottom edges (the grain term below), never a narrowing of the ends. The
 * macro silhouette is a rectangle at every note length, short or long.
 */
function woodblockPath(ctx, x0, x1, yc, half, r, seed) {
  const len = x1 - x0;
  const rr = Math.min(r, half * 0.7, len * 0.32);
  const steps = len < 20 ? 3 : len < 60 ? 5 : len < 150 ? 8 : 11;
  const freq = 1.4 + seed * 2.2;
  const phase = seed * 6.28318;

  // Grain only -- no taper term of any kind. Half-width wobbles by a few
  // tenths of a pixel along the length; it never narrows toward either end.
  const halfAt = (u) => {
    const grain = STROKE.grain * 0.7 * Math.sin(u * freq * 6.28318 + phase);
    return Math.max(0.8, half + grain);
  };

  const top = (u) => yc - halfAt(u);
  const bot = (u) => yc + halfAt(u);
  const xAt = (u) => x0 + len * u;

  ctx.moveTo(x0 + rr, top(0));
  for (let i = 1; i <= steps; i++) ctx.lineTo(xAt(i / steps) - (i === steps ? rr : 0), top(i / steps));
  ctx.quadraticCurveTo(x1, top(1), x1, top(1) + rr);
  ctx.lineTo(x1, bot(1) - rr);
  ctx.quadraticCurveTo(x1, bot(1), x1 - rr, bot(1));
  for (let i = steps - 1; i >= 0; i--) ctx.lineTo(xAt(i / steps) + (i === 0 ? rr : 0), bot(i / steps));
  ctx.quadraticCurveTo(x0, bot(0), x0, bot(0) - rr);
  ctx.lineTo(x0, top(0) + rr);
  ctx.quadraticCurveTo(x0, top(0), x0 + rr, top(0));
  ctx.closePath();
}

function snap(value, dpr) {
  return Math.round(value * dpr) / dpr;
}

/**
 * The top and bottom edges of a note traced as OPEN paths, sharing the exact
 * same grain wobble `woodblockPath` uses for its fill -- so the letterpress
 * bite below reads as the note's own edge catching light/shadow, not a
 * generic rectangle outline pasted on top.
 */
function woodblockEdge(ctx, x0, x1, yc, half, seed, top) {
  const len = x1 - x0;
  const steps = len < 20 ? 3 : len < 60 ? 5 : len < 150 ? 8 : 11;
  const freq = 1.4 + seed * 2.2;
  const phase = seed * 6.28318;
  const sign = top ? -1 : 1;
  for (let i = 0; i <= steps; i++) {
    const u = i / steps;
    const grain = STROKE.grain * 0.7 * Math.sin(u * freq * 6.28318 + phase);
    const x = x0 + len * u, y = yc + sign * Math.max(0.8, half + grain);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
}

/**
 * Letterpress ink-bite: a microscopic inset shadow along a note's top edge
 * and a soft highlight along its bottom -- the impression of a stamp
 * physically pressed into the sheet, not a second geometric layer or a new
 * plane. Two cheap batched stroke passes over the SAME notes just filled,
 * at 4-6% opacity: present enough to read as tactile depth, never enough to
 * compete with the ink itself or imply the note is anything but flat ink on
 * flat paper. The 0.75px capillary drying edge is the fixed floor -- present
 * even at high device pixel ratios, never thinned away to nothing, and it is
 * the one trace of a stroke that survives permanently once the wet-ink sheen
 * (see fillWetInk) has fully dried down and absorbed away.
 */
function drawInkBite(ctx, notes, ds) {
  if (notes.length === 0) return;
  ctx.lineWidth = Math.max(0.55, 0.75 / ds);
  ctx.beginPath();
  for (let j = 0; j < notes.length; j++) {
    const n = notes[j];
    woodblockEdge(ctx, n.x0, n.x1, n.y, n.half, noteSeed(n.id), true);
  }
  ctx.strokeStyle = "rgba(20, 14, 8, 0.055)";
  ctx.stroke();
  ctx.beginPath();
  for (let j = 0; j < notes.length; j++) {
    const n = notes[j];
    woodblockEdge(ctx, n.x0, n.x1, n.y, n.half, noteSeed(n.id), false);
  }
  ctx.strokeStyle = "rgba(255, 250, 235, 0.05)";
  ctx.stroke();
}

/**
 * A colour string's RGB channels reused at a new, explicit alpha -- accepts
 * either the `rgb(r,g,b)` or `rgba(r,g,b,a)` forms this file's own palette
 * functions produce (see rgbStr/rgbaStr) and always returns the latter, with
 * whatever alpha the caller wants rather than whatever the string already
 * carried. Falls back to returning the string unchanged if it is not one of
 * those two recognizable forms.
 */
function colorWithAlpha(color, alpha) {
  const m = /rgba?\(([^)]+)\)/.exec(String(color));
  if (!m) return color;
  const parts = m[1].split(",").map((s) => s.trim());
  const r = parts[0], g = parts[1], b = parts[2];
  return `rgba(${r}, ${g}, ${b}, ${alpha.toFixed(3)})`;
}

/**
 * Dried matte ink -- the resting-note counterpart to fillWetInk (below).
 *
 * A note that is NOT currently sounding is settled, quiet pigment already
 * absorbed into the paper's own tooth: a real, visible top-to-bottom fluid
 * gradient (0.64 -> 0.94) rather than a near-flat wash, reading as an
 * upper wash settling down into deep, concentrated sediment at the bottom
 * edge -- never the commanding wet-ink saturation, and never the meniscus
 * highlight or sediment shadow a currently-sounding note gets. One
 * gradient object and one fill per note, exactly like its wet
 * counterpart, so the two states cost the same regardless of which one a
 * given frame draws more of.
 */
function fillMatteInk(ctx, notes, color) {
  if (notes.length === 0) return;
  const ambientAlpha = ctx.globalAlpha;
  const ambientComposite = ctx.globalCompositeOperation;
  ctx.globalCompositeOperation = "multiply";
  ctx.globalAlpha = ambientAlpha;
  for (let i = 0; i < notes.length; i++) {
    const n = notes[i];
    const grad = ctx.createLinearGradient(n.x0, n.y - n.half, n.x0, n.y + n.half);
    grad.addColorStop(0, colorWithAlpha(color, 0.64));
    grad.addColorStop(1, colorWithAlpha(color, 0.94));
    ctx.fillStyle = grad;
    ctx.beginPath();
    woodblockPath(ctx, n.x0, n.x1, n.y, n.half, STROKE.radius, noteSeed(n.id));
    ctx.fill();
  }
  ctx.globalCompositeOperation = ambientComposite;
  ctx.globalAlpha = ambientAlpha;
}

/**
 * Liquid sheen & meniscus -- the sounding-note counterpart to fillMatteInk.
 *
 * The instant a note is struck it stops reading as dried, settled pigment
 * and surges toward full, commanding wet-ink saturation: each note's own
 * per-frame `sheen` value (supplied by drawVoiceNotes, ramping up across
 * the attack and back down across the release dry-down) drives a vertical
 * gradient toward alpha ~0.98 at its peak, rather than a fixed constant --
 * so the wet-in and dry-down transitions actually show on the ink itself,
 * not just in the note's physical swell.
 *
 * Two more traits real wet ink shows that dry pigment does not are added as
 * cheap batched stroke passes over the same note set, at typographic scale:
 * a delicate meniscus highlight where light catches the curved surface of
 * fresh liquid along the TOP edge, and a deeper sediment shadow where the
 * fluid pools thickest along the BOTTOM edge. Both reuse the exact same
 * grain-wobbled edge path woodblockEdge already draws for the permanent
 * ink-bite, so they read as the note's own surface catching light, not a
 * second geometric layer pasted over it.
 *
 * A third, smaller pass adds leading strike density: the physical impact
 * pool where ink first meets paper, before it has had time to flow down
 * the rest of the stroke -- a modest +10% relative concentration confined
 * to the note's own leading 16 device-independent px, clipped per note so
 * it only ever darkens that one small wedge at the attack.
 */
function fillWetInk(ctx, notes, color, ds) {
  if (notes.length === 0) return;
  const ambientAlpha = ctx.globalAlpha;
  const ambientComposite = ctx.globalCompositeOperation;
  ctx.globalCompositeOperation = "multiply";
  ctx.globalAlpha = ambientAlpha;
  for (let i = 0; i < notes.length; i++) {
    const n = notes[i];
    const peak = n.sheen != null ? n.sheen : 0.98;
    const grad = ctx.createLinearGradient(n.x0, n.y - n.half, n.x0, n.y + n.half);
    grad.addColorStop(0, colorWithAlpha(color, Math.max(0, peak - 0.10)));
    grad.addColorStop(1, colorWithAlpha(color, Math.min(0.98, peak)));
    ctx.fillStyle = grad;
    ctx.beginPath();
    woodblockPath(ctx, n.x0, n.x1, n.y, n.half, STROKE.radius, noteSeed(n.id));
    ctx.fill();
  }

  // Leading strike density: see docblock above. Confined per note to a
  // clipped leading wedge so it never spills past a genuinely short note's
  // own full length.
  const poolLen = 16 / (ds || 1);
  for (let i = 0; i < notes.length; i++) {
    const n = notes[i];
    const w = Math.min(poolLen, n.x1 - n.x0);
    if (w <= 0.5) continue;
    const peak = n.sheen != null ? n.sheen : 0.98;
    ctx.save();
    ctx.beginPath();
    ctx.rect(n.x0, n.y - n.half - 1, w, n.half * 2 + 2);
    ctx.clip();
    ctx.globalAlpha = Math.min(1, peak * 0.10);
    ctx.beginPath();
    woodblockPath(ctx, n.x0, n.x1, n.y, n.half, STROKE.radius, noteSeed(n.id));
    ctx.fillStyle = color;
    ctx.fill();
    ctx.restore();
  }

  ctx.globalCompositeOperation = ambientComposite;
  ctx.globalAlpha = ambientAlpha;

  // Meniscus highlight: fresh liquid catching light along the top edge.
  ctx.beginPath();
  for (let i = 0; i < notes.length; i++) {
    const n = notes[i];
    woodblockEdge(ctx, n.x0, n.x1, n.y, n.half, noteSeed(n.id), true);
  }
  ctx.strokeStyle = "rgba(255, 255, 255, 0.16)";
  ctx.lineWidth = Math.max(0.5, 0.6 / (ds || 1));
  ctx.stroke();

  // Sediment shadow: pigment pooling deepest along the bottom edge.
  ctx.beginPath();
  for (let i = 0; i < notes.length; i++) {
    const n = notes[i];
    woodblockEdge(ctx, n.x0, n.x1, n.y, n.half, noteSeed(n.id), false);
  }
  ctx.strokeStyle = "rgba(20, 14, 8, 0.14)";
  ctx.lineWidth = Math.max(0.5, 0.6 / (ds || 1));
  ctx.stroke();
}

/**
 * Cross-voice collision analysis: unison pitch overlaps and abutting
 * same-pitch attacks, computed ONCE per frame across every voice's visible
 * notes -- drawVoiceNotes only ever sees one voice at a time, so this is
 * the one place that can actually see two voices colliding.
 *
 * Unison: when two DIFFERENT voices sound the identical MIDI pitch with
 * overlapping time spans, laying both at the exact same y and letting the
 * ordinary multiply blend merge them only looked right where the two
 * notes' time spans fully coincided -- the instant one note started or
 * ended partway inside the other's own duration, the merged hue only
 * covered that overlapping stretch of x, and the bar read as abruptly
 * switching colour mid-note rather than as one continuous stroke. Each
 * voice now keeps its full, identical 15.2px stature but its own centre is
 * nudged a fixed UNISON_OFFSET off the shared pitch centreline -- the
 * upper voice up, the lower voice down -- so only a narrow shared band in
 * the middle actually overlaps and blends; the rest of each voice's own
 * stroke, above or below that band, stays its own pure, unbroken colour
 * for the note's entire sounding duration, in or out of the collision.
 * Each note in the pair is still tagged "top" or "bottom" purely by each
 * voice's own position in score.voices, the same top-to-bottom convention
 * the plate legend and registerWeight already use, so a Soprano/Bass
 * unison always resolves the same way regardless of which happened to be
 * scanned first; drawVoiceNotes uses the "top" tag both to choose the
 * offset direction and to queue a single internal dividing hairline for
 * the pair (see drawUnisonDividers), drawn at the shared, un-offset
 * centreline between them.
 *
 * Abutting attacks: whenever one note ends right where another begins AT
 * THE SAME PITCH -- a repeated note within one voice, or a hand-off between
 * two -- the two strokes would otherwise share an edge and read as one
 * continuous bar rather than two distinct attacks. gapBefore marks the
 * later note so drawVoiceNotes can nudge its onset forward by a crisp,
 * fixed 1.5px.
 *
 * Cost: one sort of the visible-note set (a single viewport's worth of
 * notes, never the whole score) followed by a scan that, thanks to the
 * sort, only ever compares notes sharing an exact MIDI pitch -- every other
 * pair is skipped in O(1) the moment pitches stop matching.
 */
function collectVisibleNotes(score, cursors, windowStart, windowEnd) {
  const list = [];
  for (let vi = 0; vi < score.voices.length; vi++) {
    const voice = score.voices[vi];
    for (let i = cursors[vi]; i < voice.notes.length; i++) {
      const n = voice.notes[i];
      if (n.startSec > windowEnd) break;
      if (n.endSec < windowStart) continue;
      list.push({ id: n.id, voiceId: voice.id, voiceIndex: vi, midi: n.midi, startSec: n.startSec, endSec: n.endSec });
    }
  }
  return list;
}

function analyzeNoteCollisions(score, cursors, windowStart, windowEnd) {
  const notes = collectVisibleNotes(score, cursors, windowStart, windowEnd);
  if (notes.length < 2) return null;
  notes.sort((a, b) => a.midi - b.midi || a.startSec - b.startSec);

  let roles = null, gapBefore = null;
  for (let i = 0; i < notes.length; i++) {
    const a = notes[i];
    for (let j = i + 1; j < notes.length; j++) {
      const b = notes[j];
      if (b.midi !== a.midi) break; // sorted by pitch -- nothing further can match
      if (b.voiceId !== a.voiceId) {
        const overlaps = a.startSec < b.endSec - 1e-6 && b.startSec < a.endSec - 1e-6;
        if (overlaps) {
          const upper = a.voiceIndex <= b.voiceIndex ? a : b;
          const lower = upper === a ? b : a;
          if (!roles) roles = new Map();
          roles.set(upper.id, "top");
          roles.set(lower.id, "bottom");
        }
      }
      if (Math.abs(b.startSec - a.endSec) < 0.02) { if (!gapBefore) gapBefore = new Set(); gapBefore.add(b.id); }
      else if (Math.abs(a.startSec - b.endSec) < 0.02) { if (!gapBefore) gapBefore = new Set(); gapBefore.add(a.id); }
    }
  }
  return (roles || gapBefore) ? { roles, gapBefore } : null;
}

function drawVoiceNotes(ctx, voice, v, t, from, windowStart, windowEnd, state, sc, out, tensionBuf, collisions, dividerBuf) {
  const ds = v.dpr || 1;
  out.drawn = 0; out.sounding = 0; out.thematic = 0;

  // Absolute uniform note stature: every voice, every register, every note
  // gets the identical commanding 15.2px mass -- no register-based scaling
  // by voice.weight, no lane-based compression. STROKE.weight and
  // STROKE.minWeight are both fixed at 15.2 for exactly this reason (see the
  // STROKE comment above), so this is simply that constant, snapped to the
  // device pixel grid.
  const hDev = Math.max(5, Math.round(STROKE.weight * ds));
  const height = hDev / ds;
  const half = height * 0.5;
  const oddOffset = hDev % 2 ? 0.5 / ds : 0;

  const restingNotes = [];
  const activeNotes = [];
  const roles = collisions && collisions.roles;
  const gapBefore = collisions && collisions.gapBefore;

  for (let i = from; i < voice.notes.length; i++) {
    const n = voice.notes[i];
    if (n.startSec > windowEnd) break;
    if (n.endSec < windowStart) continue;

    let x0 = snap(xOfSec(v, n.startSec, t), ds);
    // A crisp, fixed 1.5px physical gap before any note that directly abuts
    // a same-pitch predecessor (see analyzeNoteCollisions) -- otherwise two
    // consecutive attacks at the same pitch share an edge and read as one
    // continuous bar rather than two distinct strikes.
    if (gapBefore && gapBefore.has(n.id)) x0 += 1.5;
    const x1 = Math.max(x0 + STROKE.minLength, snap(xOfSec(v, n.endSec, t), ds));
    if (x1 < v.left - 50 || x0 > v.right + 50) continue;

    const centerY = snap(yOfMidi(v, n.midi), ds) + oddOffset;
    const baseHalf = half;
    // Voice crossing & unison: each voice keeps its full, identical 15.2px
    // stature, but a colliding pair no longer shares the exact same y (see
    // the analyzeNoteCollisions docblock for why). "top" nudges up and
    // "bottom" nudges down by a fixed UNISON_OFFSET, so only a narrow
    // shared band in the middle actually overlaps and blends via the
    // ordinary multiply composite -- the rest of each voice's own stroke
    // stays its own pure colour for the note's whole duration. The single
    // internal dividing hairline is still queued once per pair (from the
    // "top" note only) at the shared, un-offset centreline, drawn after
    // every voice's own ink is down, in drawUnisonDividers.
    const role = roles && roles.get(n.id);
    let y = centerY;
    if (role === "top") y = snap(centerY - UNISON_OFFSET, ds);
    else if (role === "bottom") y = snap(centerY + UNISON_OFFSET, ds);
    if (role === "top" && dividerBuf) dividerBuf.push({ x0, x1, y: centerY, half: baseHalf });

    const dur = Math.max(0.06, n.endSec - n.startSec);

    let breathe = 0;
    const isSounding = t >= n.startSec && t < n.endSec;
    const isPostRelease = !isSounding && t >= n.endSec && t < n.endSec + 0.08;

    if (isSounding) {
      out.sounding++;
      const elapsed = t - n.startSec;
      const vel = Math.max(0.4, Math.min(1.0, n.vel || 0.75));

      // Hydraulic impact expansion: a cushioned pen-pressure swell held to
      // a strict 10%-12% of the note's own half-height across the full
      // velocity range -- the strike reads as one tangible, visible event,
      // never a rubbery balloon and never a mechanical shake. It settles
      // smoothly over ~120ms down to a subtle +3% "living breath" cushion,
      // which then keeps the ink alive with a gentle, continuous
      // respiration wave (see breathPulse below) for as long as the note
      // continues sounding -- never decaying away to nothing, and never
      // truly freezing in place either.
      const peakSwell = baseHalf * (0.10 + vel * 0.02);
      const sustainSwell = baseHalf * 0.03;
