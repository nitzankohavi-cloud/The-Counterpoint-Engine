const DEFAULT_INSTRUMENT = "piano";
// Presentation order in the dropdown, matching the brief's own numbered list
// (Concert Grand, Harpsichord, Cathedral Organ, Felt Upright) rather than the
// registry's insertion order, which groups the two sampler-based voices
// together for readability in the source and would otherwise leak into the UI.
const INSTRUMENT_UI_ORDER = ["piano", "harpsichord", "organ", "feltPiano"];
const INSTRUMENT_LOAD_TIMEOUT_MS = 12000;

function panPosition(index, count) {
  if (count <= 1) return 0;
  const SPREAD = 0.35;
  return -SPREAD + (index * 2 * SPREAD) / (count - 1);
}

function headroomGain(activeVoices, base) {
  const n = Math.max(1, activeVoices);
  return Math.min(base, base / Math.sqrt(n));
}

// Chamber early reflections: three discrete taps (not the reverb tail
// itself) at times a small hall's own geometry would actually produce,
// alternating left/right so the reflections read as coming off two
// different walls rather than one repeated echo. REVERB.decay/preDelay
// above still describe the diffuse LATE tail (this.reverb, below); these
// are only the room's own first few milliseconds.
const EARLY_REFLECTIONS = [
  { delaySec: 0.016, pan: -0.30, gain: 0.22 },
  { delaySec: 0.028, pan: 0.30, gain: 0.17 },
  { delaySec: 0.044, pan: -0.16, gain: 0.12 },
];
// Steep damping shared by both the early reflections and the late tail --
// a real room's air and wall absorption eats high frequencies fast, and a
// single -24dB/octave lowpass at the one point both paths already sum
// through is cheaper and more physically honest than damping each path
// separately.
const WET_DAMP = { frequency: 3000, rolloff: -24, Q: 0.5 };

// Broadcast mastering bus, inserted after the instrument/reverb sum and
// before the limiter: a touch more soundboard body, a cut where cheap
// speakers otherwise turn "warm" into "muddy," and a silk-shelf lift in
// the extreme top for sheen without brittleness -- then a gentle bus
// compressor to even out the piece's own natural dynamic swings before
// the limiter does its harder, purely protective job. This stage gain-
// STAGES toward a commercial loudness target; nothing here is an actual
// integrated-LUFS meter (that needs K-weighting and gated measurement
// this file does not implement), so treat -14 LUFS as the aim behind the
// numbers below, not a guaranteed, measured output.
const MASTER_EQ = {
  body: { frequency: 250, gain: 1.8, Q: 1.0 },
  mud: { frequency: 500, gain: -1.8, Q: 1.1 },
  silk: { frequency: 10000, gain: 1.0 },
};
const MASTER_COMPRESSOR = { ratio: 1.6, threshold: -13, attack: 0.03, release: 0.2 };

// Thematic presence: a Subject or Answer statement (see MOTIF, section 5)
// gets a +1.8dB LOUDNESS lift in the mix (see AudioEngine.schedule) so the
// fugue's own main theme cuts through its counter-lines -- converted once
// here to a linear gain multiplier rather than repeating the dB math per
// note.
const THEME_PRESENCE_DB = 1.8;
const THEME_PRESENCE_GAIN = Math.pow(10, THEME_PRESENCE_DB / 20);

// Human contrapuntal inflection: a strict +/-2.5ms Gaussian jitter on
// every note's own onset, so a fast contrapuntal passage stops reading as
// machine-quantized. A fixed, hard-clamped window -- never a looser
// "feel" -- so ensemble timing never audibly drifts.
const ONSET_JITTER_SEC = 0.0025;

/**
 * Box-Muller Gaussian sample, clamped to +/- maxSec. Three standard
 * deviations comfortably covers the curve's real mass; the explicit clamp
 * is the actual, non-negotiable ceiling regardless of how the random pair
 * happens to land.
 */
function gaussianJitterSec(maxSec) {
  const u1 = Math.max(1e-9, Math.random());
  const u2 = Math.random();
  const z = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
  return Math.max(-maxSec, Math.min(maxSec, z * (maxSec / 3)));
}

let pianoBuffers = null;
let pianoLoad = null;

function loadPiano() {
  if (pianoLoad) return pianoLoad;
  pianoLoad = new Promise((resolve, reject) => {
    const urls = {};
    for (const note of PIANO_NOTES) urls[note] = note.replace("#", "s") + ".mp3";
    const buffers = new Tone.ToneAudioBuffers({
      urls,
      baseUrl: SALAMANDER_BASE,
      onload: () => { pianoBuffers = buffers; resolve(buffers); },
      onerror: (err) => reject(err),
    });
  });
  return pianoLoad;
}

class AudioEngine {
  constructor() {
    this.channels = new Map();
    this.score = null;
    this.analysis = null;
    this.scale = 1.0;
    this.started = false;
    this.ready = false;
    this.masterBase = 0.92;

    this.busIn = new Tone.Gain(1);
    this.master = new Tone.Gain(this.masterBase);
    this.monitor = new Tone.Gain(1);

    // Soundboard body resonance. This REVERSES an earlier "the bus should
    // stay neutral" decision made when only one instrument existed and
    // per-instrument colouring made a shared bus-wide EQ redundant. It is
    // applied to busIn -- shared by every instrument, piano or not -- per
    // the explicit target given; a touch of soundboard-like warmth costs
    // nothing on the synthesized voices and is exactly what real acoustic
    // instruments have that pure synthesis otherwise lacks.
    this.bodyBoost = new Tone.Filter({ type: "peaking", frequency: 320, gain: 2.4, Q: 1.0 });
    this.antiMud = new Tone.Filter({ type: "peaking", frequency: 660, gain: -1.6, Q: 1.3 });
    this.airShelf = new Tone.Filter({ type: "highshelf", frequency: 11500, gain: -2.5 });
    this.busIn.connect(this.bodyBoost);
    this.bodyBoost.connect(this.antiMud);
    this.antiMud.connect(this.airShelf);

    // Manual dry/wet split rather than Tone.Reverb's own internal crossfade,
    // specifically so "HF damping above 3600Hz to prevent metallic pinging"
    // can apply to the WET tail only -- the dry signal must stay exactly as
    // bright as the EQ above left it. Reverb itself is built at wet:1.0 (a
    // fully wet processor, contributing no dry copy of its own), so drySend
    // and the damped wet path are two genuinely separate signal components
    // summing at master, not two copies of the same one -- the "exactly one
    // path for the dry signal" principle established earlier still holds,
    // it is just that the dry path is now built explicitly rather than
    // implicitly inside the Reverb node.
    this.drySend = new Tone.Gain(1 - REVERB.wet);
    this.wetSend = new Tone.Gain(REVERB.wet);
    this.airShelf.connect(this.drySend);
    this.airShelf.connect(this.wetSend);

    this.limiter = new Tone.Limiter(-0.5);
    this.drySend.connect(this.master);

    // The damping filter is built unconditionally, before the try below --
    // it is the one shared landing point for BOTH the discrete early
    // reflections and the algorithmic late tail, so it needs to exist
    // regardless of whether Tone.Reverb itself succeeds.
    this.reverbDamp = new Tone.Filter({
      type: "lowpass", frequency: WET_DAMP.frequency, rolloff: WET_DAMP.rolloff, Q: WET_DAMP.Q,
    });
    try {
      this.reverb = new Tone.Reverb({ decay: REVERB.decay, preDelay: REVERB.preDelay, wet: 1.0 });
      this.wetSend.connect(this.reverb);
      this.reverb.connect(this.reverbDamp);
    } catch (err) {
      this.reverb = null;
      // Late tail unavailable -- the early-reflections network below still
      // reaches the same damped bus, so the room isn't left completely dry.
    }

    // Chamber early reflections: three discrete delay taps feeding the SAME
    // damped wet bus as the late tail above, each panned to its own side so
    // they read as distinct early wall reflections rather than one repeated
    // slap-back. Plain Delay/Panner/Gain nodes never fail to construct
    // (unlike Tone.Reverb above), so this network exists even in the rare
    // environment where the convolution-based tail does not.
    this.earlyReflections = EARLY_REFLECTIONS.map((tap) => {
      const delay = new Tone.Delay(tap.delaySec);
      const pan = new Tone.Panner(tap.pan);
      const gain = new Tone.Gain(tap.gain);
      this.wetSend.connect(delay);
      delay.connect(pan);
      pan.connect(gain);
      gain.connect(this.reverbDamp);
      return { delay, pan, gain };
    });
    this.reverbDamp.connect(this.master);

    // Broadcast mastering bus: master EQ, then a gentle bus compressor,
    // then the existing brick-wall limiter -- in that order, so the EQ and
    // compressor shape the piece's own dynamics before the limiter's purely
    // protective ceiling ever engages. See MASTER_EQ / MASTER_COMPRESSOR
    // above for the honest caveat on what "-14 LUFS" means here.
    this.masterEqBody = new Tone.Filter({
      type: "peaking", frequency: MASTER_EQ.body.frequency, gain: MASTER_EQ.body.gain, Q: MASTER_EQ.body.Q,
    });
    this.masterEqMud = new Tone.Filter({
      type: "peaking", frequency: MASTER_EQ.mud.frequency, gain: MASTER_EQ.mud.gain, Q: MASTER_EQ.mud.Q,
    });
    this.masterEqSilk = new Tone.Filter({
      type: "highshelf", frequency: MASTER_EQ.silk.frequency, gain: MASTER_EQ.silk.gain,
    });
    this.masterCompressor = new Tone.Compressor({
      ratio: MASTER_COMPRESSOR.ratio, threshold: MASTER_COMPRESSOR.threshold,
      attack: MASTER_COMPRESSOR.attack, release: MASTER_COMPRESSOR.release,
    });
    this.master.connect(this.masterEqBody);
    this.masterEqBody.connect(this.masterEqMud);
    this.masterEqMud.connect(this.masterEqSilk);
    this.masterEqSilk.connect(this.masterCompressor);
    this.masterCompressor.connect(this.limiter);
    this.limiter.connect(this.monitor);
    this.monitor.toDestination();

    this.recordTap = Tone.getContext().createMediaStreamDestination();
    Tone.connect(this.limiter, this.recordTap);

    this.monitorMuted = false;
    this.instrumentId = DEFAULT_INSTRUMENT;
    this.pianoUnavailable = false;
    this.pianoLoadPromise = null;
  }

  mediaStream() {
    return this.recordTap.stream;
  }

  setMonitor(on) {
    this.monitorMuted = !on;
    this.monitor.gain.rampTo(on ? 1 : 0, 0.02);
  }
  toggleMonitor() { this.setMonitor(this.monitorMuted); return !this.monitorMuted; }

  updateHeadroom(activeVoices) {
    const g = headroomGain(activeVoices, this.masterBase);
    this.master.gain.rampTo(g, 0.08);
    return g;
  }

  get transport() { return Tone.getTransport(); }
  get scoreSeconds() { return this.transport.seconds * this.scale; }
  get loaded() { return this.ready; }
  /** True once the real acoustic samples are decoded and confirmed usable. */
  get pianoReady() { return !!pianoBuffers && !this.pianoUnavailable; }

  /**
   * Starts fetching and decoding the acoustic piano samples immediately,
   * before any user gesture or instrument selection -- decoding audio data
   * does not require a running AudioContext, only actually SOUNDING it does.
   * This is what makes the "pre-export buffer lock" meaningful in practice:
   * by the time a user gets around to clicking Export Video, loading has
   * very often already finished in the background rather than starting from
   * zero at that moment. loadPiano() itself is memoized, so calling this
   * again later (e.g. from unlock()) is a cheap no-op if already in flight.
   */
  beginEagerPianoLoad() {
    if (this.pianoLoadPromise) return this.pianoLoadPromise;
    this.pianoLoadPromise = loadPiano().then(() => Tone.loaded()).then(() => {
      this.pianoUnavailable = false;
      return true;
    }).catch((err) => {
      console.warn("[audio] Piano samples failed to preload.", err);
      this.pianoUnavailable = true;
      return false;
    });
    return this.pianoLoadPromise;
  }

  /**
   * Resumes the AudioContext, then makes sure the CURRENTLY SELECTED
   * instrument is actually ready to sound.
   *
   * Organ and harpsichord need nothing but the context: pure synthesis, zero
   * load time, work offline. Piano and felt upright need the sample set,
   * which is a real network fetch and deserves a real chance to succeed
   * rather than a short race that silently swaps in a different instrument
   * the user did not choose -- that exact swap is what made "the piano"
   * sound like an organ in practice before, regardless of how the Sampler
   * itself was tuned. 12 seconds is generous; if it still fails (genuinely
   * offline, blocked by CORS on file://), the organ is offered explicitly.
   */
  async unlock() {
    try {
      if (Tone.context.state !== "running") await Tone.start();
      const raw = Tone.context.rawContext;
      if (raw && raw.state === "suspended" && raw.resume) await raw.resume();
      this.started = true;
    } catch (e) {}

    const wantsPiano = (INSTRUMENTS[this.instrumentId] || {}).kind === "sampler";
    if (!wantsPiano) {
      this.ready = true;
      this.attachInstruments();
      // Piano samples load in the background regardless, so switching to a
      // piano voice later doesn't make the user wait from zero.
      this.beginEagerPianoLoad();
      return;
    }

    if (this.ready && !this.pianoUnavailable) { this.attachInstruments(); return; }

    try {
      const timeout = new Promise((_, reject) =>
        setTimeout(() => reject(new Error("Timeout")), INSTRUMENT_LOAD_TIMEOUT_MS));
      await Promise.race([loadPiano().then(() => Tone.loaded()), timeout]);
      this.pianoUnavailable = false;
    } catch (err) {
      console.warn("[audio] Piano samples unavailable; use the instrument selector to pick a synthesized voice.", err);
      this.pianoUnavailable = true;
      this.instrumentId = "organ";
    }
    this.ready = true;
    this.attachInstruments();
  }

  /** Disposes whichever instrument nodes a channel currently has, regardless of which of the 4 kinds built them. */
  disposeChannelInstrument(ch) {
    if (ch.inst) ch.inst.dispose();
    if (ch.filter) ch.filter.dispose();
    if (ch.velFilter) ch.velFilter.dispose();
    if (ch.dampFilter) ch.dampFilter.dispose();
    if (ch.presenceFilter) ch.presenceFilter.dispose();
    if (ch.rolloffFilter) ch.rolloffFilter.dispose();
    if (ch.stops) for (const s of ch.stops) s.synth.dispose();
    ch.inst = null; ch.filter = null; ch.velFilter = null; ch.dampFilter = null;
    ch.presenceFilter = null; ch.rolloffFilter = null; ch.stops = null;
  }

  /**
   * Switches every channel's instrument without touching the Tone.Part
   * schedule or the transport position -- the Part callback reads `ch.inst`
   * (or `ch.stops`) fresh at fire time, so a mid-playback switch is
   * seamless. Falls back to the organ, with a clear reason, if the piano's
   * samples never loaded.
   */
  async setInstrument(id) {
    if ((id === "piano" || id === "feltPiano") && this.pianoUnavailable) id = "organ";
    if (id === this.instrumentId) return this.instrumentId;
    this.instrumentId = id;
    if ((id === "piano" || id === "feltPiano") && !pianoBuffers && !this.pianoUnavailable) {
      try {
        const timeout = new Promise((_, reject) =>
          setTimeout(() => reject(new Error("Timeout")), INSTRUMENT_LOAD_TIMEOUT_MS));
        await Promise.race([loadPiano().then(() => Tone.loaded()), timeout]);
      } catch (err) {
        this.pianoUnavailable = true;
        this.instrumentId = "organ";
      }
    }
    for (const ch of this.channels.values()) this.disposeChannelInstrument(ch);
    this.attachInstruments();
    return this.instrumentId;
  }

  /** Builds and connects one channel's instrument for the currently selected id. */
  attachInstruments() {
    if (!this.ready) return;
    const cfg = INSTRUMENTS[this.instrumentId] || INSTRUMENTS[DEFAULT_INSTRUMENT];
    const useFallback = (cfg.kind === "sampler") && (this.pianoUnavailable || !pianoBuffers);
    const effectiveKind = useFallback ? "organStops" : cfg.kind;
    const effectiveCfg = useFallback ? INSTRUMENTS.organ : cfg;

    for (const ch of this.channels.values()) {
      if (ch.inst || ch.stops) continue;

      if (effectiveKind === "sampler") {
        const urls = {};
        for (const note of PIANO_NOTES) urls[note] = pianoBuffers.get(note);
        const sampler = new Tone.Sampler({ urls, release: effectiveCfg.release });
        sampler.volume.value = effectiveCfg.volume;
        // Velocity-tracking brightness: one dedicated filter per channel,
        // automated per note (see schedule()) rather than rebuilt per note.
        const velFilter = new Tone.Filter(effectiveCfg.velocityFilter.f1, "lowpass");
        // High-shelf dampener: the second half of the two-stage velocity
        // timbre model -- soft strikes lose some hammer-bite brightness
        // above 4.5kHz on top of (not instead of) the lowpass above.
        const dampFilter = new Tone.Filter({ type: "highshelf", frequency: 4500, gain: 0 });
        // Soundboard presence: a gentle peaking lift in the instrument's body.
        const presenceFilter = new Tone.Filter({
          type: "peaking", frequency: effectiveCfg.presence.frequency, gain: effectiveCfg.presence.gain, Q: 0.9,
        });
        const rolloffFilter = new Tone.Filter(effectiveCfg.rolloff, "lowpass");
        sampler.connect(velFilter);
        velFilter.connect(dampFilter);
        dampFilter.connect(presenceFilter);
        presenceFilter.connect(rolloffFilter);
        rolloffFilter.connect(ch.panner);
        ch.inst = sampler; ch.velFilter = velFilter; ch.dampFilter = dampFilter;
        ch.presenceFilter = presenceFilter; ch.rolloffFilter = rolloffFilter;
      } else if (effectiveKind === "organStops") {
        const filter = new Tone.Filter(effectiveCfg.filterFrequency, "lowpass");
        filter.connect(ch.panner);
        ch.filter = filter;
        ch.stops = effectiveCfg.stops.map((stop) => {
          const synth = new Tone.PolySynth(Tone.Synth, {
            oscillator: stop.oscillator,
            envelope: effectiveCfg.envelope,
            // Each stop's own volume, in dB, from its linear mix gain --
            // this is the "octave harmonics" layering, not a single wave.
            volume: effectiveCfg.volume + 20 * Math.log10(Math.max(0.001, stop.gain)),
          });
          synth.connect(filter);
          return { synth, semitones: stop.semitones };
        });
      } else {
        // "synth": harpsichord -- a single bright voice through its own
        // dedicated highpass, unlike every other voice here which lowpasses.
        const filter = new Tone.Filter({ type: effectiveCfg.filterType, frequency: effectiveCfg.filterFrequency, Q: effectiveCfg.filterQ });
        const synth = new Tone.PolySynth(Tone.Synth, {
          oscillator: effectiveCfg.oscillator,
          envelope: effectiveCfg.envelope,
          volume: effectiveCfg.volume,
        });
        synth.connect(filter);
        filter.connect(ch.panner);
        ch.inst = synth; ch.filter = filter;
      }
    }
  }

  setTempo(factor) {
    const next = Math.max(0.4, Math.min(2.0, factor));
    if (Math.abs(next - this.scale) < 0.001) return;
    const at = this.scoreSeconds;
    const wasPlaying = this.transport.state === "started";
    this.transport.pause();
    this.scale = next;
    this.schedule();
    this.seek(at);
    if (wasPlaying) this.transport.start();
  }

  teardown() {
    this.transport.stop();
    this.transport.cancel(0);
    this.transport.seconds = 0;
    this.releaseAll();
    this.disposeParts();
    for (const ch of this.channels.values()) {
      this.disposeChannelInstrument(ch);
      ch.panner.dispose(); ch.gain.dispose();
    }
    this.channels.clear();
    this.score = null;
    this.analysis = null;
  }

  load(score, analysis) {
    this.teardown();
    this.score = score;
    this.analysis = analysis || null;
    const n = score.voices.length;
    score.voices.forEach((voice, i) => {
      const gain = new Tone.Gain(1).connect(this.busIn);
      const panner = new Tone.Panner(panPosition(i, n)).connect(gain);
      this.channels.set(voice.id, {
        inst: null, filter: null, velFilter: null, presenceFilter: null,
        rolloffFilter: null, stops: null, panner, gain, part: null,
      });
    });
    this.updateHeadroom(n);
    this.attachInstruments();
    this.schedule();
  }

  /**
   * Release scaled to the note's own sounded duration. A struck sixteenth
   * decays quickly (the way it does on a real instrument once the next note
   * interrupts it); a held chord or final note gets the full natural bloom
   * up to `base`. This is what lets a single 1.15s base release satisfy both
   * "chords ring naturally" and "fast counterpoint stays articulate" instead
   * of the two fighting each other.
   */
  releaseFor(dur, base) {
    return Math.max(0.12, Math.min(base, dur * 0.9));
  }

  schedule() {
    if (!this.score) return;
    this.disposeParts();
    const cfg = INSTRUMENTS[this.instrumentId] || INSTRUMENTS[DEFAULT_INSTRUMENT];
    for (const voice of this.score.voices) {
      const ch = this.channels.get(voice.id);
      if (!ch) continue;
      const events = voice.notes.map((n) => {
        const dur = Math.max(0.06, (n.endSec - n.startSec) / this.scale);
        // Preserve the source file's own dynamics. A small floor (silent
        // notes are never useful) and a gentle presence lift are kept, but
        // the shape of the source dynamics survives across nearly the
        // whole range.
        const vel = Math.max(0.08, Math.min(1.0, (n.vel || 0.72) * 1.05 + 0.04));
        // Thematic presence: a Subject or Answer statement gets a +1.8dB
        // LOUDNESS lift (THEME_PRESENCE_GAIN) applied only to the trigger
        // velocity actually used for amplitude below. The velocity fed to
        // the timbre filters stays this note's real, unboosted `vel`, so a
        // thematic statement cuts through the texture without also
        // sounding artificially brighter than it was actually struck.
        const motif = this.analysis && this.analysis.motifOf ? this.analysis.motifOf[n.id] : undefined;
        const isTheme = motif === MOTIF.SUBJECT || motif === MOTIF.ANSWER;
        const triggerVel = isTheme ? Math.min(1.0, vel * THEME_PRESENCE_GAIN) : vel;
        return {
          // Human contrapuntal inflection: a strict, hard-clamped +/-2.5ms
          // Gaussian jitter on the note's own onset (see gaussianJitterSec)
          // -- fast contrapuntal runs stop reading as machine-quantized
          // without drifting far enough to feel like mistimed ensemble.
          time: Math.max(0, n.startSec / this.scale + gaussianJitterSec(ONSET_JITTER_SEC)),
          midi: n.midi,
          note: Tone.Frequency(n.midi, "midi").toNote(),
          dur,
          vel,
          triggerVel,
          release: this.releaseFor(dur, cfg.kind === "sampler" ? cfg.release : 0),
        };
      });
      const part = new Tone.Part((time, ev) => {
        // Pitch-to-pan tracking applies before the instrument-kind branch --
        // both the sampler path and the organ's stacked stops share the
        // same single ch.panner, so this sets it once per note regardless
        // of which path fires next.
        ch.panner.pan.setTargetAtTime(pitchToPan(ev.midi), time, 0.006);

        if (ch.stops) {
          // Cathedral organ: fire every stop together, each transposed by
          // its own rank interval.
          for (const stop of ch.stops) {
            if (!stop.synth || stop.synth.disposed) continue;
            try {
              const note = Tone.Frequency(ev.midi + stop.semitones, "midi").toNote();
              stop.synth.triggerAttackRelease(note, ev.dur, time, ev.triggerVel);
            } catch (err) {}
          }
          return;
        }
        const inst = ch.inst;
        if (!inst || inst.disposed) return;
        const activeCfg = INSTRUMENTS[this.instrumentId] || INSTRUMENTS[DEFAULT_INSTRUMENT];
        // setTargetAtTime rather than setValueAtTime for both stages of the
        // velocity timbre model: an instant jump on a fast contrapuntal run
        // is exactly what produces an audible digital "step" between
        // adjacent notes. A 6ms time constant is short enough to still read
        // as immediate but long enough to round off that step completely.
        if (ch.velFilter && !ch.velFilter.disposed && activeCfg.velocityFilter) {
          ch.velFilter.frequency.setTargetAtTime(velocityToCutoff(ev.vel, activeCfg.velocityFilter), time, 0.006);
        }
        if (ch.dampFilter && !ch.dampFilter.disposed) {
          ch.dampFilter.gain.setTargetAtTime(velocityToDamperGain(ev.vel), time, 0.006);
        }
        try {
          if (ev.release > 0 && "release" in inst) inst.release = ev.release;
          inst.triggerAttackRelease(ev.note, ev.dur, time, ev.triggerVel);
        } catch (err) {}
      }, events);
      part.start(0);
      ch.part = part;
    }
  }

  disposeParts() {
    for (const ch of this.channels.values()) {
      if (ch.part) ch.part.dispose();
      ch.part = null;
    }
  }

  play() { this.transport.start(); }
  pause() { this.transport.pause(); this.releaseAll(); }

  seek(scoreSec) {
    const clamped = Math.max(0, Math.min(scoreSec, this.score ? this.score.durSec : 0));
    this.transport.seconds = clamped / this.scale;
    this.releaseAll();
  }

  applyMix(isAudible) {
    let active = 0;
    for (const [id, ch] of this.channels) {
      const audible = isAudible(id);
      if (audible) active++;
      ch.gain.gain.rampTo(audible ? 1 : 0, 0.03);
      if (!audible) this.releaseChannel(ch);
    }
    this.updateHeadroom(active);
  }

  /** Releases whichever voice(s) a channel currently has -- a single
   *  instrument, or (for the multi-stop organ) every rank at once. */
  releaseChannel(ch) {
    if (ch.inst) ch.inst.releaseAll();
    if (ch.stops) for (const s of ch.stops) if (s.synth) s.synth.releaseAll();
  }

  releaseAll() { for (const ch of this.channels.values()) this.releaseChannel(ch); }
  dispose() {
    this.teardown();
    const nodes = [this.busIn, this.bodyBoost, this.antiMud, this.airShelf,
      this.drySend, this.wetSend, this.reverb, this.reverbDamp,
      this.masterEqBody, this.masterEqMud, this.masterEqSilk, this.masterCompressor,
      this.limiter, this.master, this.monitor];
    if (this.earlyReflections) {
      for (const tap of this.earlyReflections) nodes.push(tap.delay, tap.pan, tap.gain);
    }
    for (const node of nodes) if (node) node.dispose();
  }
}

/* ==========================================================================
 * 14. STORE & RENDERER (Strict Infallible Boundary Clipping)
 * ========================================================================== */

class Store {
  constructor() {
    this.state = {
      score: null, analysis: null,
      theme: DEFAULT_THEME, audioReady: false,
      playing: false, tempoScale: 1.0,
      pxPerSec: 225,
      presentation: false,
    };
    this.listeners = new Set();
  }
  get() { return this.state; }
  set(patch) {
    const changed = new Set();
    for (const key of Object.keys(patch)) {
      if (patch[key] !== undefined && patch[key] !== this.state[key]) {
        this.state[key] = patch[key];
        changed.add(key);
      }
    }
    if (changed.size === 0) return;
    for (const fn of this.listeners) fn(this.state, changed);
  }
  subscribe(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); }
  isAudible() { return true; }
}

const MINIMAP_HEIGHT = 28;
const EMPTY_TAGS = new Uint8Array(0);

/**
 * Weather-like inertia: how open or close the frame feels, tracking the
 * texture's actual density over many seconds rather than reacting to it.
 *
 * A large, cheap radial gradient rather than a pixel-level regeneration of
 * the paper texture -- the cached parchment stays exactly as it is; this is
 * a soft compositing pass on top of it, the same way a colour-grade vignette
 * sits on top of a finished frame rather than being baked into the set.
 * Deliberately tiny in range (a ~10% swing in the transparent zone's own
 * radius, capped at 5% darkening at the very outer edge) -- the brief is
 * "nearly subconscious," and both numbers are sized to fail an "can you see
 * it happening" test while still being present in a side-by-side still.
 */
function drawBreathingVignette(ctx, view, densityEMA, isDark) {
  const cx = (view.left + view.right) / 2;
  const cy = (view.top + view.bottom) / 2;
  const maxR = Math.hypot(view.right - view.left, view.bottom - view.top) / 2;
  const innerR = maxR * (0.78 + densityEMA * 0.10);
  const outerR = maxR * 1.05;
  const grad = ctx.createRadialGradient(cx, cy, Math.max(0, innerR), cx, cy, outerR);
  const tint = isDark ? "0,0,0" : "20,14,6";
  grad.addColorStop(0, `rgba(${tint},0)`);
  grad.addColorStop(1, `rgba(${tint},0.05)`);
  ctx.fillStyle = grad;
  ctx.fillRect(view.left - 40, view.top - 40, view.right - view.left + 80, view.bottom - view.top + 80);
}

class Renderer {
  constructor(staticCanvas, dynamicCanvas, minimapCanvas, store, engine) {
    this.staticCanvas = staticCanvas;
    this.dynamicCanvas = dynamicCanvas;
    this.minimapCanvas = minimapCanvas;
    this.store = store;
    this.engine = engine;
    this.staticCtx = staticCanvas.getContext("2d", { alpha: false });
    this.dynamicCtx = dynamicCanvas.getContext("2d", { alpha: true });
    this.minimapCtx = minimapCanvas.getContext("2d", { alpha: true });

    this.view = null; this.score = null; this.analysis = null; this.raf = 0;
    this.cursors = []; this.maxDur = []; this.scratch = [];
    this.thematicNow = new Uint8Array(0);
    this.voiceRow = new Map();
    this.rowOf = new Int32Array(0);
    // Intentional permanent no-op: several call sites elsewhere (tempo
    // changes, instrument switches, file loads, errors) still call
    // renderer.console.push(...) for what used to feed the on-screen debug
    // log. The log itself, and the DOM Console class that rendered it, are
    // gone per the "no diagnostics console" brief -- rather than hunt down
    // every scattered call site, this keeps them all valid, silent no-ops.
    this.console = { push() {}, clear() {} };
    this.lastWindowStart = -Infinity;
    this.staticDirty = true;
    this.minimapSize = { width: 0, height: MINIMAP_HEIGHT };
    this.frames = 0; this.fpsAt = 0;
    this.paper = null;
    this.fit = null;
    this.showRules = true;
    this.densityEMA = 0;
    this.lastFrameNow = performance.now();
    this.tensionBuf = [];
    this.dividerBuf = [];
    this.aspectMode = "landscape";
    this.lastPullBack = 0;
    this.win = { start: 0, end: 0 };
    this.state = { audible: true, spotlight: false, highlight: false, motifOf: EMPTY_TAGS };
    this.staticOpacity = 1;
    this.clockNow = () => performance.now();
    this.out = { drawn: 0, sounding: 0 };
    this.capture = null;
    this.leftFade = null;
    this.rightFade = null;
    this.stats = { fps: 0, drawn: 0, sounding: 0, thematicVoices: 0 };
    this.prologue = new Prologue();
    this.onFrame = null;
    this.onPrologueEnd = null;

    store.subscribe((s, changed) => {
      if (changed.has("pxPerSec") || changed.has("presentation")) this.staticDirty = true;
    });
  }

  reset() {
    this.stop();
    this.prologue.cancel();
    this.score = null; this.analysis = null; this.view = null;
    this.cursors = []; this.maxDur = []; this.scratch = [];
    this.thematicNow = new Uint8Array(0);
    this.voiceRow = new Map();
    this.rowOf = new Int32Array(0);
    this.lastWindowStart = -Infinity;
    this.lastPullBack = 0;
    this.staticOpacity = -1;
    this.setStaticOpacity(1);
    this.clear();
  }

  clear() {
    for (const [ctx, canvas] of [
      [this.staticCtx, this.staticCanvas],
      [this.dynamicCtx, this.dynamicCanvas],
      [this.minimapCtx, this.minimapCanvas],
    ]) {
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.restore();
    }
  }

  setScore(score, analysis) {
    this.score = score;
    this.analysis = analysis || null;
    this.cursors = score.voices.map(() => 0);
    this.scratch = score.voices.map(() => ({}));
    this.thematicNow = new Uint8Array(score.voices.length);
    this.voiceRow = new Map(score.voices.map((v, i) => [v.id, i]));
    let maxId = 0;
    for (const v of score.voices) if (v.id > maxId) maxId = v.id;
    this.rowOf = new Int32Array(maxId + 1).fill(-1);
    score.voices.forEach((v, i) => { this.rowOf[v.id] = i; });
    this.maxDur = score.voices.map((v) => {
      let m = 0;
      for (const n of v.notes) m = Math.max(m, n.endSec - n.startSec);
      return m;
    });
    this.lastWindowStart = -Infinity;
    this.staticDirty = true;
    this.resize();
  }

  resize() {
    if (!this.score) return;
    const parent = this.dynamicCanvas.parentElement;
    if (!parent) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const width = parent.clientWidth, height = parent.clientHeight;
    if (!(width > 0) || !(height > 0)) return;

    const fit = this.aspectMode === "shorts"
      ? plateFitCover(width, height, platePlayheadX())
      : plateFit(width, height);
    fit.deviceScale = fit.scale * dpr;
    fit.dpr = dpr;
    fit.txDevice = Math.round(fit.offsetX * dpr);
    fit.tyDevice = Math.round(fit.offsetY * dpr);
    this.fit = fit;

    for (const c of [this.staticCanvas, this.dynamicCanvas]) {
      c.width = Math.round(width * dpr);
      c.height = Math.round(height * dpr);
      c.style.width = width + "px";
      c.style.height = height + "px";
    }
    const m = fit.deviceScale;
    for (const ctx of [this.staticCtx, this.dynamicCtx]) {
      ctx.setTransform(m, 0, 0, m, Math.round(fit.offsetX * dpr), Math.round(fit.offsetY * dpr));
    }

    const mmParent = this.minimapCanvas.parentElement;
    const mmWidth = (mmParent && mmParent.clientWidth) || width;
    this.minimapCanvas.width = Math.round(mmWidth * dpr);
    this.minimapCanvas.height = Math.round(MINIMAP_HEIGHT * dpr);
    this.minimapCanvas.style.width = mmWidth + "px";
    this.minimapCanvas.style.height = MINIMAP_HEIGHT + "px";
    this.minimapCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.minimapSize = { width: mmWidth, height: MINIMAP_HEIGHT };

    this.view = layoutView(this.score, m, this.store.get().pxPerSec);
    this.paper = null;
    this.staticDirty = true;

    // Narrow margin edge fade: a tight, crisp terminal absorption right at
    // the very edge of the plate (14px), not a wide bleached fog eating
    // into the reading window -- notes stay dark, solid, and fully legible
    // all the way out to within this last sliver of the margin.
    const fadeWidth = 14;
    const leftFade = this.dynamicCtx.createLinearGradient(this.view.left, 0, this.view.left + fadeWidth, 0);
    leftFade.addColorStop(0, "rgba(0,0,0,1)");
    leftFade.addColorStop(1, "rgba(0,0,0,0)");
    this.leftFade = leftFade;

    const rightFade = this.dynamicCtx.createLinearGradient(this.view.right - fadeWidth, 0, this.view.right, 0);
    rightFade.addColorStop(0, "rgba(0,0,0,0)");
    rightFade.addColorStop(1, "rgba(0,0,0,1)");
    this.rightFade = rightFade;
  }

  /**
   * Switches between Landscape (16:9, contain-fit) and Shorts (9:16,
   * cover-fit centered on the playhead). Toggles the body class that
   * reshapes #stage itself -- resize() reads the new shape immediately
   * after, so the plate re-fits to the new box in the very next call.
   */
  setAspectMode(mode) {
    if (mode !== "landscape" && mode !== "shorts") return;
    if (this.aspectMode === mode) return;
    this.aspectMode = mode;
    document.body.classList.toggle("shorts-mode", mode === "shorts");
    this.resize();
  }

  getView() { return this.view; }
  beginPrologue(monogram) { this.prologue.begin(monogram, performance.now()); }
  skipPrologue() {
    if (!this.prologue.active) return;
    this.prologue.cancel();
    this.staticCanvas.style.opacity = "1";
    if (this.onPrologueEnd) this.onPrologueEnd();
  }

  start() {
    if (this.raf) return;
    const tick = () => { this.raf = requestAnimationFrame(tick); this.frame(); };
    this.raf = requestAnimationFrame(tick);
  }
  stop() { cancelAnimationFrame(this.raf); this.raf = 0; }

  setStaticOpacity(a) {
    if (this.staticOpacity === a) return;
    this.staticOpacity = a;
    this.staticCanvas.style.opacity = a === 1 ? "1" : String(a);
  }

  setCaptureTarget(canvas) {
    this.capture = canvas ? { canvas, ctx: canvas.getContext("2d") } : null;
  }

  frame() {
    const score = this.score;
    let view = this.view;
    if (this.staticCanvas.width === 0 || this.dynamicCanvas.width === 0) return;
    if (!score || !view || !(view.width > 0) || !(view.height > 0) || !(view.rowH > 0)) return;
    if (score.voices.length === 0 || this.scratch.length !== score.voices.length) return;

    const wantPx = this.store.get().pxPerSec;
    if (view.pxPerSec !== wantPx) { view.pxPerSec = wantPx; this.staticDirty = true; }

    const t = this.engine.scoreSeconds;

    // Cadence pull-back: recomputed only in the rare window near a piece's
    // end (its final measure through a few seconds into the reverb tail),
    // so every ordinary frame elsewhere pays nothing for this. Margins
    // widen via a smoothstep ease -- "slow and stately," not a linear creep
    // -- and reset the instant a seek lands back before the final measure.
    let pullBack = 0;
    if (score.measures.length > 0) {
      const lastMeasureStart = score.measures[score.measures.length - 1].startSec;
      const tailEnd = score.durSec + 2.5;
      if (t >= lastMeasureStart && tailEnd > lastMeasureStart) {
        const raw = Math.max(0, Math.min(1, (t - lastMeasureStart) / (tailEnd - lastMeasureStart)));
        pullBack = raw * raw * (3 - 2 * raw);
      }
    }
    if (Math.abs(pullBack - this.lastPullBack) > 0.001) {
      view = layoutView(score, view.dpr, view.pxPerSec, undefined, pullBack);
      this.view = view;
      this.staticDirty = true; // margins moved -> the cached rule-line layer must redraw at the new bounds
      this.lastPullBack = pullBack;
    }

    const win = visibleWindow(view, t, this.win);
    const ws = win.start, we = win.end;

    if (this.staticDirty) {
      if (!this.paper) this.paper = makePaper(PLATE.width, PLATE.height);
      drawPaper(this.staticCtx, score, view, this.paper, this.showRules, this.staticCanvas);
      this.staticDirty = false;
    }

    const ctx = this.dynamicCtx;
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, this.dynamicCanvas.width, this.dynamicCanvas.height);
    ctx.restore();

    const prologueActive = this.prologue.active;
    if (prologueActive) {
      const a = ease(unfoldFraction(this.prologue.elapsed(this.clockNow())));
      ctx.globalAlpha = a;
      this.setStaticOpacity(a);
    }

    if (this.showRules) drawRules(ctx, score, view, t, ws, we);

    const rewound = ws < this.lastWindowStart;
    this.lastWindowStart = ws;

    let drawn = 0, sounding = 0, voicesSounding = 0;
    this.tensionBuf.length = 0;
    this.dividerBuf.length = 0;

    // Cursors are advanced once, up front, so the cross-voice collision scan
    // below and the actual per-voice draw pass see exactly the same visible
    // note set -- rather than the scan running against stale cursors from
    // the previous frame while the draw loop advances its own copy live.
    for (let vi = 0; vi < score.voices.length; vi++) {
      const voice = score.voices[vi];
      if (!voice) continue;
      const margin = ws - this.maxDur[vi];
      let cursor = this.cursors[vi];
      if (rewound) cursor = lowerBoundSec(voice.notes, margin);
      else while (cursor < voice.notes.length && voice.notes[cursor].startSec < margin) cursor++;
      this.cursors[vi] = cursor;
    }
    const collisions = analyzeNoteCollisions(score, this.cursors, ws, we);

    // Strict boundary clipping: ensures thick woodblock slugs never leak outside margins
    ctx.save();
    ctx.beginPath();
    ctx.rect(view.left, view.top - 6, view.innerW, view.innerH + 12);
    ctx.clip();

    ctx.globalCompositeOperation = THEME.blend;

    for (let vi = 0; vi < score.voices.length; vi++) {
      const voice = score.voices[vi];
      const sc = this.scratch[vi];
      if (!voice || !sc || !voice.palette) continue;

      drawVoiceNotes(ctx, voice, view, t, this.cursors[vi], ws, we, this.state, sc, this.out, this.tensionBuf, collisions, this.dividerBuf);
      drawn += this.out.drawn;
      sounding += this.out.sounding;
      if (this.out.sounding > 0) voicesSounding++;
    }

    drawCapillaryTension(ctx, this.tensionBuf, view.dpr);
    drawUnisonDividers(ctx, this.dividerBuf, view.dpr);

    // Soft Edge Fading inside plate bounds only
    if (this.leftFade && this.rightFade) {
      ctx.globalCompositeOperation = "destination-out";
      ctx.fillStyle = this.leftFade;
      ctx.fillRect(view.left, view.top - 6, 14, view.innerH + 12);
      ctx.fillStyle = this.rightFade;
      ctx.fillRect(view.right - 14, view.top - 6, 14, view.innerH + 12);
    }
    ctx.restore();

    ctx.globalCompositeOperation = "source-over";
    drawPlayhead(ctx, view);

    // Weather-like inertia: a time-based (not frame-based) exponential
    // smoothing, so the same 6-second time constant holds regardless of
    // actual frame rate. Suppressed during the prologue, whose own title
    // card already covers this whole region.
    if (!prologueActive) {
      const nowMs = this.clockNow();
      const dt = Math.max(0, Math.min(0.25, (nowMs - this.lastFrameNow) / 1000));
      this.lastFrameNow = nowMs;
      const targetDensity = score.voices.length > 0 ? voicesSounding / score.voices.length : 0;
      const DENSITY_TIME_CONSTANT = 6.0;
      this.densityEMA += (targetDensity - this.densityEMA) * (1 - Math.exp(-dt / DENSITY_TIME_CONSTANT));
      drawBreathingVignette(ctx, view, this.densityEMA, THEME.isDark);
    } else {
      this.lastFrameNow = this.clockNow();
    }

    // The one surviving piece of on-plate typography: which colour is which
    // voice. Hidden only during the prologue's own title card.
    if (!prologueActive) drawPlateLegend(ctx, score, view);

    if (prologueActive) {
      ctx.globalAlpha = 1;
      const frame = this.prologue.draw(ctx, score, view, this.clockNow());
      if (frame.done) {
        this.setStaticOpacity(1);
        if (this.onPrologueEnd) this.onPrologueEnd();
      }
    }

    drawMinimap(this.minimapCtx, score, this.analysis, this.minimapSize.width, this.minimapSize.height, t, this.rowOf);

    if (this.capture) this.composite(view);

    const now = performance.now();
    this.frames++;
    const stats = this.stats;
    stats.drawn = drawn;
    stats.sounding = sounding;
    stats.thematicVoices = voicesSounding;
    if (now - this.fpsAt >= 500) {
      stats.fps = Math.round((this.frames * 1000) / (now - this.fpsAt));
      this.frames = 0;
      this.fpsAt = now;
    }

    if (this.onFrame) this.onFrame(t, stats);
  }

  /**
   * Draws the live plate into the capture canvas.
   *
   * Landscape: crops to exactly the plate's own region (excluding the
   * on-screen letterbox bars), using the exact translate values resize()
   * applied to the live context, so the crop rectangle can never drift out
   * of alignment with what was actually drawn.
   *
   * Shorts: NO crop math here at all -- resize()'s cover-fit already drew
   * the correctly-framed 9:16 content directly onto the live canvases at
   * their own native (narrow) resolution, via the transform, not via a
   * post-hoc crop. Re-applying plate-region crop math on top of an already
   * narrow source canvas would ask drawImage for a source rectangle far
   * larger than the canvas actually contains. The live canvas IS the frame;
   * export is a direct copy.
   */
  composite(view) {
    const { canvas, ctx } = this.capture;
    if (!ctx) return;
    const h = canvas.height - MINIMAP_HEIGHT;
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = THEME.paperEdge;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const fit = this.fit;
    ctx.globalAlpha = this.staticOpacity < 0 ? 1 : this.staticOpacity;
    if (this.aspectMode === "shorts") {
      ctx.drawImage(this.staticCanvas, 0, 0, canvas.width, h);
      ctx.globalAlpha = 1;
      ctx.drawImage(this.dynamicCanvas, 0, 0, canvas.width, h);
    } else if (fit && fit.scale && fit.deviceScale) {
      const sx = fit.txDevice, sy = fit.tyDevice;
      const sw = PLATE.width * fit.deviceScale, sh = PLATE.height * fit.deviceScale;
      ctx.drawImage(this.staticCanvas, sx, sy, sw, sh, 0, 0, canvas.width, h);
      ctx.globalAlpha = 1;
      ctx.drawImage(this.dynamicCanvas, sx, sy, sw, sh, 0, 0, canvas.width, h);
    } else {
      // No fit computed yet (shouldn't happen once a score is loaded, but
      // fail toward showing something rather than a blank frame).
      ctx.drawImage(this.staticCanvas, 0, 0, canvas.width, h);
      ctx.globalAlpha = 1;
      ctx.drawImage(this.dynamicCanvas, 0, 0, canvas.width, h);
    }
    ctx.drawImage(this.minimapCanvas, 0, h, canvas.width, MINIMAP_HEIGHT);
    ctx.restore();
  }
}

/* ==========================================================================
 * 15. EMBEDDED DEFAULT FIXTURE
 * ========================================================================== */

function defaultFixture() {
  const PPQ = 480, S = PPQ / 4;
  const SUBJ = [
    [0, 2, 72], [2, 1, 71], [3, 1, 72], [4, 2, 67], [6, 2, 68],
    [8, 2, 72], [10, 1, 71], [11, 1, 72], [12, 2, 67], [14, 2, 68],
    [16, 1, 72], [17, 1, 70], [18, 1, 68], [19, 1, 70], [20, 1, 68], [21, 1, 67], [22, 1, 65], [23, 1, 67],
    [24, 4, 68], [28, 2, 67], [30, 2, 65], [32, 8, 63]
  ];
  const ANSW = [
    [0, 2, 67], [2, 1, 66], [3, 1, 67], [4, 2, 62], [6, 2, 63],
    [8, 2, 67], [10, 1, 66], [11, 1, 67], [12, 2, 62], [14, 2, 63],
    [16, 1, 67], [17, 1, 65], [18, 1, 63], [19, 1, 65], [20, 1, 63], [21, 1, 62], [22, 1, 60], [23, 1, 62],
    [24, 4, 63], [28, 2, 62], [30, 2, 60], [32, 8, 58]
  ];
  const BASS_SUBJ = [
    [0, 2, 48], [2, 1, 47], [3, 1, 48], [4, 2, 43], [6, 2, 44],
    [8, 2, 48], [10, 1, 47], [11, 1, 48], [12, 2, 43], [14, 2, 44],
    [16, 1, 48], [17, 1, 46], [18, 1, 44], [19, 1, 46], [20, 1, 44], [21, 1, 43], [22, 1, 41], [23, 1, 43],
    [24, 4, 44], [28, 2, 43], [30, 2, 41], [32, 8, 36]
  ];

  const build = (phrase, start) => phrase.map(([off, dur, midi]) => ({
    tick: start + off * S, durTick: dur * S, midi, vel: 0.85
  }));

  return buildScore({
    name: "Fugue in C minor (Exposition)",
    ppq: PPQ,
    tempos: [{ tick: 0, usPerQuarter: 60000000 / 84 }],
    timeSignatures: [{ tick: 0, numerator: 4, denominator: 4 }],
    voices: [
      { label: "Soprano", notes: build(SUBJ, 0) },
      { label: "Alto", notes: build(ANSW, 18 * S) },
      { label: "Bass", notes: build(BASS_SUBJ, 36 * S) },
    ],
  });
}

/* ==========================================================================
 * 16. FULL QUALITY VIDEO EXPORT (Guaranteed Unmuted Audio Stream)
 * ========================================================================== */

const VIDEO_MIME = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"];

function pickMime() {
  if (typeof MediaRecorder === "undefined") return null;
  for (const m of VIDEO_MIME) {
    try { if (MediaRecorder.isTypeSupported(m)) return m; } catch (e) {}
  }
  return null;
}

function videoExportSupported() {
  return typeof MediaRecorder !== "undefined" &&
    typeof HTMLCanvasElement !== "undefined" &&
    typeof HTMLCanvasElement.prototype.captureStream === "function" &&
    pickMime() !== null;
}

class VideoExport {
  constructor(store, engine, renderer, session) {
    this.store = store; this.engine = engine; this.renderer = renderer; this.session = session;
    this.recorder = null; this.chunks = []; this.canvas = null;
    this.active = false; this.aborted = false; this.starting = false;
    this.onProgress = null;
    this.onState = null;
    this.wasMuted = false;
    this.visibilityHandler = () => this.handleVisibility();
  }

  get progress() {
    const score = this.store.get().score;
    if (!score || !this.active) return 0;
    return Math.max(0, Math.min(1, this.engine.scoreSeconds / score.durSec));
  }

  async start() {
    // Reentrancy guard set SYNCHRONOUSLY, before the first await. The old
    // code checked `this.active` but only set it true after `await
    // this.engine.unlock()` resolved -- a second click (or a slow sample
    // load) during that gap passed the same check and built a second,
    // independent MediaRecorder that raced the first for the same canvas
    // and audio stream. `this.starting` closes that window immediately.
    if (this.active || this.starting) return;
    this.starting = true;
    try {
      await this.startInner();
    } finally {
      this.starting = false;
    }
  }

  async startInner() {
    const score = this.store.get().score;
    const monogram = this.session.monogram;
    if (!score || !monogram) return;
    const mime = pickMime();
    if (!mime) { this.report("Video export is not supported in this browser."); return; }

    const intendedInstrument = this.engine.instrumentId;
    const intendedIsPiano = (INSTRUMENTS[intendedInstrument] || {}).kind === "sampler";

    await this.engine.unlock();
    if (this.active) return; // a concurrent call finished first while we awaited

    // The hard guarantee, checked at the one point that actually matters:
    // immediately before a single frame is recorded. Everything upstream
    // (the disabled button, the eager preload) is there to make this check
    // pass in the common case, but none of it is load-bearing by itself.
    //
    // Critical ordering: `intendedInstrument` is captured BEFORE unlock(),
    // because unlock() can itself silently rewrite engine.instrumentId to
    // "organ" as its own internal fallback when piano fails to load. Reading
    // instrumentId only AFTER unlock() -- which an earlier version of this
    // check did -- means the check always sees the ALREADY-substituted
    // state and can never actually catch the failure: by the time it looks,
    // the goalposts have already moved to organ, so "the current instrument
    // is not piano" reads as fine even though the user's actual selection
    // just got silently overridden underneath them.
    if (intendedIsPiano && (this.engine.instrumentId !== intendedInstrument || !this.engine.pianoReady)) {
      this.report("Cannot export: acoustic piano samples did not load, and video export will not substitute a synthesized fallback. Wait for loading to finish, or switch to a synthesized instrument to export that instead.");
      return;
    }

    const stage = this.renderer.dynamicCanvas;
    const fit = this.renderer.fit;
    if (!fit || !fit.scale) {
      this.report("Cannot export yet — the plate has not finished laying out.");
      return;
    }
    // A clean 16:9 target derived from the current display's own height,
    // rather than the old `stage.clientWidth x stage.clientHeight`, which is
    // whatever arbitrary aspect ratio the browser window happens to be at
    // the moment of export and bakes the on-screen letterbox bars into the
    // exported file. composite() now crops to the live plate region using
    // this.fit, so pairing that with a guaranteed-16:9 target here is what
    // actually produces a clean export -- fixing only one side of this would
    // still leave a distorted result.
    // A clean target resolution derived explicitly from the selected aspect
    // ratio -- never from the raw stage.clientWidth/clientHeight, which is
    // whatever pixel size the browser happens to be rendering at and would
    // bake in rounding fuzz or (in the old bug this replaced) an arbitrary
    // window shape entirely. Landscape targets 16:9 from the display's own
    // height; Shorts targets 9:16 from the display's own height the other
    // way, with a higher floor (1280 vs 720) since vertical platforms are
    // typically viewed at higher effective resolution on phone screens.
    let targetW, targetH;
    if (this.renderer.aspectMode === "shorts") {
      targetH = Math.max(1280, Math.round(stage.clientHeight / 2) * 2);
      targetW = Math.round((targetH * 9 / 16) / 2) * 2;
    } else {
      targetH = Math.max(720, Math.round(stage.clientHeight / 2) * 2);
      targetW = Math.round((targetH * PLATE.width / PLATE.height) / 2) * 2;
    }
    this.canvas = document.createElement("canvas");
    this.canvas.width = targetW;
    this.canvas.height = targetH + MINIMAP_HEIGHT;
    this.renderer.setCaptureTarget(this.canvas);

    const stream = this.canvas.captureStream(60);
    for (const track of this.engine.mediaStream().getAudioTracks()) stream.addTrack(track);

    this.chunks.length = 0;
    this.aborted = false;
    this.recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 14000000 });
    this.recorder.ondataavailable = (e) => { if (e.data && e.data.size) this.chunks.push(e.data); };
    this.recorder.onstop = () => this.finish(mime, monogram);
    // A runtime failure mid-recording (a track ending, an encoder fault) used
    // to leave the export "active" forever with no feedback and no cleanup.
    this.recorder.onerror = (e) => {
      console.error("[video export]", e);
      this.report("Recording failed — see console.");
      this.aborted = true;
      this.cleanup();
    };

    this.wasMuted = this.engine.monitorMuted;
    this.engine.setMonitor(false);
    this.engine.seek(0);
    this.active = true;
    this.recorder.start(250);
    this.engine.play();
    this.store.set({ playing: true });
    document.addEventListener("visibilitychange", this.visibilityHandler);
    this.report(`Exporting Video — 0%`);
    if (this.onState) this.onState(true);
  }

  handleVisibility() {
    if (!this.active || !this.recorder) return;
    if (document.hidden) {
      if (this.recorder.state === "recording") this.recorder.pause();
      this.engine.pause();
      this.store.set({ playing: false });
      this.report("Recording paused — tab hidden.");
    } else {
      if (this.recorder.state === "paused") this.recorder.resume();
      this.engine.play();
      this.store.set({ playing: true });
    }
  }

  tick(t) {
    if (!this.active) return;
    const score = this.store.get().score;
    if (!score) return;
    this.report(`Exporting Video — ${Math.round(this.progress * 100)}%`);
    if (t >= score.durSec) this.stop(false);
  }

  stop(aborted) {
    if (!this.active) return;
    this.aborted = !!aborted;
    this.active = false;
    document.removeEventListener("visibilitychange", this.visibilityHandler);
    this.engine.pause();
    this.store.set({ playing: false });
    try { if (this.recorder && this.recorder.state !== "inactive") this.recorder.stop(); }
    catch (err) { console.error(err); this.cleanup(); }
  }

  finish(mime, monogram) {
    this.cleanup();
    if (this.aborted) { this.report("Export aborted."); return; }
    const blob = new Blob(this.chunks, { type: mime });
    this.chunks.length = 0;
    const name = slug(monogram.catalogue && monogram.catalogue !== "\u2014" ? monogram.catalogue : monogram.title);
    downloadBlob(blob, `${name}.webm`);
    this.report(`Exported ${name}.webm (${(blob.size / 1048576).toFixed(1)} MB)`);
  }

  cleanup() {
    this.renderer.setCaptureTarget(null);
    this.canvas = null;
    this.recorder = null;
    this.engine.setMonitor(!this.wasMuted);
    if (this.onState) this.onState(false);
  }

  report(text) { if (this.onProgress) this.onProgress(text); }
}

/* ==========================================================================
 * 17. SESSION
 * ========================================================================== */

class Session {
  constructor(store, engine, renderer) {
    this.store = store; this.engine = engine; this.renderer = renderer;
    this.monogram = null;
    this.frameZero = null;
    this.frameZeroToken = 0;
    this.onFrameZero = null;
  }

  invalidateFrameZero(score, monogram) {
    this.frameZero = null;
    const token = ++this.frameZeroToken;
    renderFrameZero(score, monogram).then((canvas) => {
      if (token !== this.frameZeroToken) return;
      this.frameZero = canvas;
      if (this.onFrameZero) this.onFrameZero(canvas);
    }).catch((err) => {
      console.error("[frame0]", err);
      if (this.onFrameZero) this.onFrameZero(null, err);
    });
  }

  reset() {
    this.renderer.reset();
    this.engine.teardown();
    this.monogram = null;
    this.frameZero = null;
    this.frameZeroToken++;
    this.store.set({ score: null, analysis: null, playing: false });
  }

  open(score, hints) {
    this.reset();
    const analysis = analyze(score);

    this.engine.load(score, analysis);
    this.engine.seek(0);
    this.store.set({ score, analysis, playing: false });
    this.engine.applyMix(() => true);
    this.renderer.setScore(score, analysis);
    this.monogram = buildMonogram(score, analysis, hints || {});

    this.renderer.start();
    this.renderer.beginPrologue(this.monogram);
    this.invalidateFrameZero(score, this.monogram);

    return analysis;
  }

  openBuffer(buffer, name, hints) {
    const { score, diagnostics } = ingestMidi(buffer, { name });
    const analysis = this.open(score, hints);
    return Object.assign({}, diagnostics, { occurrences: analysis.occurrences.length });
  }
}

/* ==========================================================================
 * 18. UI CONTROLS & SELECTION DECK
 * ========================================================================== */

function clock(sec) {
  const x = Math.max(0, Math.floor(sec));
  return `${Math.floor(x / 60)}:${String(x % 60).padStart(2, "0")}`;
}

class Deck {
  constructor(root, store, engine, renderer, session, video, hooks) {
    this.store = store; this.engine = engine; this.renderer = renderer;
    this.session = session; this.video = video; this.hooks = hooks;
    this.lastLabel = ""; this.scrubbing = false; this.hideTimer = 0;

    root.innerHTML =
      '<button class="play" type="button" title="Space">Play</button>' +
      '<div class="scrub" role="slider" tabindex="0" aria-label="Position"><div class="scrub-fill"></div></div>' +
      '<span class="time">0:00 / 0:00</span>' +
      '<div class="deck-sep"></div>' +

      '<div class="deck-sep"></div>' +
      '<select class="instrument-select" title="Instrument">' +
        INSTRUMENT_UI_ORDER.map((id) => `<option value="${id}">${INSTRUMENTS[id].name}</option>`).join("") +
      '</select>' +
      '<div class="deck-sep"></div>' +
      '<select class="tempo-select" title="Playback Speed">' +
        '<option value="0.75">0.75x</option>' +
        '<option value="0.9">0.9x</option>' +
        '<option value="1.0" selected>1.0x</option>' +
        '<option value="1.15">1.15x</option>' +
        '<option value="1.3">1.3x</option>' +
      '</select>' +
      '<div class="deck-sep"></div>' +
      '<select class="aspect-select" title="Aspect Ratio">' +
        '<option value="landscape">Landscape (16:9)</option>' +
        '<option value="shorts">Shorts (9:16)</option>' +
      '</select>' +
      '<div class="deck-sep"></div>' +
      '<button class="video" type="button" title="Export Full HD Video with Audio">Export Video</button>' +
      '<button class="thumb icon" type="button" title="Capture Thumbnail (PNG)" aria-label="Capture thumbnail">\u2b1a</button>' +
      '<button class="mode icon" type="button" title="Switch Theme (T)" aria-label="Switch theme"></button>' +
      '<button class="pick" type="button">Open MIDI</button>' +
      '<input class="file" type="file" accept=".mid,.midi,audio/midi" hidden />';

    this.el = {
      play: root.querySelector(".play"),
      time: root.querySelector(".time"),
      track: root.querySelector(".scrub"),
      fill: root.querySelector(".scrub-fill"),
      mode: root.querySelector(".mode"),
      instrumentSelect: root.querySelector(".instrument-select"),
      tempoSelect: root.querySelector(".tempo-select"),
      aspectSelect: root.querySelector(".aspect-select"),
      video: root.querySelector(".video"),
      thumb: root.querySelector(".thumb"),
      file: root.querySelector(".file"),
      status: document.getElementById("status"),
    };

    this.el.play.addEventListener("click", () => this.toggle());
    this.el.mode.addEventListener("click", () => hooks.toggleTheme());
    this.el.video.addEventListener("click", () => this.video.start());
    this.el.thumb.addEventListener("click", () => this.captureThumbnail());
    root.querySelector(".pick").addEventListener("click", () => this.el.file.click());

    this.el.aspectSelect.value = renderer.aspectMode;
    this.el.aspectSelect.addEventListener("change", (e) => {
      renderer.setAspectMode(e.target.value);
      renderer.console.push("ASPECT", e.target.value === "shorts" ? "9:16 Shorts" : "16:9 Landscape");
    });

    this.el.tempoSelect.addEventListener("change", (e) => {
      const val = parseFloat(e.target.value);
      engine.setTempo(val);
      renderer.console.push("TEMPO", `${val.toFixed(2)}x`);
    });

    this.el.instrumentSelect.value = engine.instrumentId;
    this.el.instrumentSelect.addEventListener("change", async (e) => {
      const wanted = e.target.value;
      this.el.instrumentSelect.disabled = true;
      const wantsSamples = INSTRUMENTS[wanted] && INSTRUMENTS[wanted].kind === "sampler";
      if (wantsSamples && !engine.pianoReady) this.setStatus("Loading piano samples\u2026");
      const actual = await engine.setInstrument(wanted);
      this.el.instrumentSelect.value = actual;
      this.el.instrumentSelect.disabled = false;
      if (actual !== wanted) {
        this.setStatus("Piano samples unavailable \u2014 switched to Chamber Organ.");
      } else if (wantsSamples) {
        this.setStatus("");
      }
      renderer.console.push("VOICE", INSTRUMENTS[actual].name);
      this.refreshExportGate();
    });

    this.el.file.addEventListener("change", () => {
      const f = this.el.file.files && this.el.file.files[0];
      if (f) this.loadFile(f);
      this.el.file.value = "";
    });

    if (!videoExportSupported()) {
      this.el.video.disabled = true;
      this.el.video.title = "MediaRecorder unavailable.";
    } else {
      // Pre-export buffer lock: the button starts disabled if the current
      // instrument needs samples that are not confirmed ready yet, and
      // re-checks once the background load (kicked off eagerly at boot,
      // see beginEagerPianoLoad) settles either way.
      this.refreshExportGate();
      engine.beginEagerPianoLoad().finally(() => this.refreshExportGate());
    }

    this.el.track.addEventListener("pointerdown", (e) => {
      this.scrubbing = true;
      this.el.track.setPointerCapture(e.pointerId);
      this.seekFrom(e);
    });
    this.el.track.addEventListener("pointermove", (e) => { if (this.scrubbing) this.seekFrom(e); });
    this.el.track.addEventListener("pointerup", (e) => {
      this.scrubbing = false;
      try { this.el.track.releasePointerCapture(e.pointerId); } catch (err) {}
    });

    store.subscribe((s, changed) => {
      if (changed.has("playing")) {
        this.el.play.textContent = s.playing ? "Pause" : "Play";
        if (s.playing) this.armAutoHide(); else this.reveal(true);
      }
      if (changed.has("theme")) this.syncTheme(s.theme);
    });

    this.video.onProgress = (text) => this.setStatus(text, "");
    this.video.onState = (recording) => {
      if (this.renderer) this.renderer.console.push("EXPORT", recording ? "recording started" : "recording finished");
      if (recording) { this.el.video.disabled = true; this.reveal(false); }
      else this.refreshExportGate();
    };

    this.wireDropZone(document.body);
    this.wireAutoHide();
  }

  /**
   * The pre-export buffer lock. Piano-family voices (Concert Grand, Felt
   * Upright) must have their real acoustic buffers confirmed decoded before
   * export is allowed; every other voice needs nothing but "not already
   * recording." Re-run on construction, whenever the eager background load
   * settles, and whenever the instrument selection changes -- any of those
   * can flip whether the gate applies at all.
   */
  refreshExportGate() {
    if (!videoExportSupported()) return; // already permanently disabled
    if (this.video.active) { this.el.video.disabled = true; return; }
    const cfg = INSTRUMENTS[this.engine.instrumentId] || INSTRUMENTS[DEFAULT_INSTRUMENT];
    if (cfg.kind !== "sampler" || this.engine.pianoReady) {
      this.el.video.disabled = false;
      this.el.video.title = "Export Full HD Video with Audio";
      this.el.video.textContent = "Export Video";
    } else if (this.engine.pianoUnavailable) {
      this.el.video.disabled = true;
      this.el.video.title = "Video export needs the acoustic piano, which failed to load on this connection. Reload to retry, or switch to a synthesized instrument.";
      this.el.video.textContent = "Piano Unavailable";
    } else {
      this.el.video.disabled = true;
      this.el.video.title = "Loading acoustic piano samples for export\u2026";
      this.el.video.textContent = "Loading Piano\u2026";
    }
  }

  /**
   * Captures the CURRENT frame -- whatever is actually on screen at the
   * instant of the click, mid-performance included -- as a high-resolution
   * PNG, with the work's title stamped in the same classical serif used
   * throughout the piece. Deliberately distinct from the frame-0 monogram
   * export (renderFrameZero/exportThumbnail): that one is a fixed opening
   * title card meant to represent the whole video as a YouTube thumbnail;
   * this one is a live snapshot of one particular passage, the way a
   * viewer might grab a still to point at a specific moment in the piece.
   */
  async captureThumbnail() {
    const view = this.renderer.getView();
    const fit = this.renderer.fit;
    if (!view || !fit || !fit.scale) return;

    const targetW = 1920;
    const targetH = this.renderer.aspectMode === "shorts"
      ? Math.round(targetW * 16 / 9)
      : Math.round(targetW * PLATE.height / PLATE.width);
    const canvas = document.createElement("canvas");
    canvas.width = targetW; canvas.height = targetH;
    const ctx = canvas.getContext("2d");
    if (!ctx) return;

    if (this.renderer.aspectMode === "shorts") {
      ctx.drawImage(this.renderer.staticCanvas, 0, 0, targetW, targetH);
      ctx.drawImage(this.renderer.dynamicCanvas, 0, 0, targetW, targetH);
    } else {
      const sx = fit.txDevice, sy = fit.tyDevice;
      const sw = PLATE.width * fit.deviceScale, sh = PLATE.height * fit.deviceScale;
      ctx.drawImage(this.renderer.staticCanvas, sx, sy, sw, sh, 0, 0, targetW, targetH);
      ctx.drawImage(this.renderer.dynamicCanvas, sx, sy, sw, sh, 0, 0, targetW, targetH);
    }

    const m = this.session.monogram;
    if (m) {
      if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }
      const pad = targetH * 0.045;
      const titleSize = targetH * 0.034;
      ctx.save();
      ctx.font = `italic ${titleSize}px ${DISPLAY_STACK}`;
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
      const label = m.title + (m.catalogue && m.catalogue !== "\u2014" ? "  \u00B7  " + m.catalogue : "");
      const tw = ctx.measureText(label).width;
      // A quiet plate-mark frame behind the stamp, exactly the same bevel
      // convention as every note and the opening title card -- not a solid
      // box, which would look like a caption bar pasted on top.
      ctx.fillStyle = "rgba(250, 247, 238, 0.82)";
      ctx.fillRect(pad - titleSize * 0.5, targetH - pad - titleSize * 1.5, tw + titleSize, titleSize * 2.1);
      ctx.fillStyle = "rgba(42, 36, 33, 0.92)";
      ctx.fillText(label, pad, targetH - pad - titleSize * 0.35);
      ctx.restore();
    }

    try {
      const blob = await canvasToBlob(canvas);
      downloadBlob(blob, slug(m ? m.title : "counterpoint") + "-thumbnail.png");
    } catch (err) {
      console.error("[thumbnail]", err);
      this.setStatus("Could not capture thumbnail.");
    }
  }

  syncTheme(id) {
    const isDark = id === "obsidian";
    this.el.mode.textContent = isDark ? "\u2600" : "\u25D0";
    this.el.mode.title = isDark ? "Switch to Archival Vellum (T)" : "Switch to Japanese Sumi (T)";
  }

  async toggle() {
    const wasReady = this.engine.ready;
    if (!wasReady && this.engine.instrumentId === "piano") {
      this.el.play.disabled = true;
      this.setStatus("Loading piano samples\u2026");
    }
    await this.engine.unlock();
    if (!wasReady) {
      this.el.play.disabled = false;
      if (this.engine.pianoUnavailable && this.engine.instrumentId !== "piano") {
        this.setStatus("Piano samples unavailable \u2014 playing Chamber Organ instead.");
        this.el.instrumentSelect.value = "organ";
      } else {
        this.setStatus("");
      }
    }
    const playing = !this.store.get().playing;
    if (playing) this.engine.play(); else this.engine.pause();
    this.store.set({ playing });
  }

  seekFrom(e) {
    const score = this.store.get().score;
    const rect = this.el.track.getBoundingClientRect();
    this.engine.seek(Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width)) * (score ? score.durSec : 0));
  }

  update(t) {
    const score = this.store.get().score;
    const dur = score ? score.durSec : 0;
    this.el.fill.style.transform = `scaleX(${dur > 0 ? Math.min(1, t / dur) : 0})`;
    const label = `${clock(t)} / ${clock(dur)}`;
    if (label !== this.lastLabel) { this.el.time.textContent = label; this.lastLabel = label; }
  }

  wireAutoHide() {
    const wake = () => { this.reveal(true); if (this.store.get().playing) this.armAutoHide(); };
    window.addEventListener("pointermove", wake, { passive: true });
    window.addEventListener("pointerdown", wake, { passive: true });
  }

  armAutoHide() {
    clearTimeout(this.hideTimer);
    this.hideTimer = setTimeout(() => {
      if (this.store.get().playing && !this.scrubbing) document.body.classList.add("deck-hidden");
    }, 2500);
  }

  reveal(allowReturn) {
    clearTimeout(this.hideTimer);
    if (this.video.active && !allowReturn) { document.body.classList.add("deck-hidden"); return; }
    if (this.video.active) return;
    document.body.classList.remove("deck-hidden");
  }

  wireDropZone(target) {
    let depth = 0;
    target.addEventListener("dragenter", (e) => { e.preventDefault(); if (++depth === 1) target.classList.add("dropping"); });
    target.addEventListener("dragover", (e) => { e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = "copy"; });
    target.addEventListener("dragleave", () => { if (--depth <= 0) { depth = 0; target.classList.remove("dropping"); } });
    target.addEventListener("drop", (e) => {
      e.preventDefault(); depth = 0; target.classList.remove("dropping");
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) this.loadFile(f);
    });
  }

  readLocalFile(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        if (reader.result instanceof ArrayBuffer) resolve(reader.result);
        else reject(new Error("Could not read binary data."));
      };
      reader.onerror = () => reject(reader.error || new Error("Could not read file."));
      reader.readAsArrayBuffer(file);
    });
  }

  /**
   * Loads a dropped or picked file. The presentation stays clean fine art
   * throughout: on success, nothing is printed to the screen at all -- no
   * filename, no track count, no note count -- since a museum plate never
   * annotates itself with its own parsing statistics. Only genuine problems
   * (an unreadable file) still surface a message, because that is
   * necessary feedback rather than telemetry.
   */
  async loadFile(file) {
    if (this.busy) return;
    this.busy = true;
    if (this.video.active) this.video.stop(true);
    this.setStatus(`Loading ${file.name}\u2026`, "");
    try {
      const buffer = await this.readLocalFile(file);
      this.session.openBuffer(buffer, file.name, {});
      this.setStatus("", "");
    } catch (err) {
      this.session.reset();
      this.setStatus(err && err.message ? err.message : "Unreadable file.", "error");
    } finally { this.busy = false; }
  }

  setStatus(text, kind) {
    this.el.status.textContent = text;
    this.el.status.className = "autohide " + (kind || "");
  }
}

/* ==========================================================================
 * 19. BOOT & THEME SWITCHING
 * ========================================================================== */

function applyTheme(id, store, renderer, session) {
  const theme = THEMES.find((t) => t.id === id) || THEMES[0];
  activeTheme = theme;
  THEME = environmentFor(theme);

  const root = document.documentElement;
  if (theme.isDark) root.setAttribute("data-theme", "obsidian");
  else root.removeAttribute("data-theme");

  root.style.setProperty("--paper", theme.paper);
  root.style.setProperty("--paper-edge", theme.paperEdge);
  root.style.setProperty("--ink", theme.ink);

  const score = store.get().score;
  if (score) {
    applyVoicePalettes(score, theme);
    renderer.paper = null;
    renderer.staticDirty = true;
    if (session.monogram) session.invalidateFrameZero(score, session.monogram);
  }
  store.set({ theme: theme.id });
}

function boot() {
  if (typeof Tone === "undefined") {
    const fatal = document.getElementById("fatal");
    fatal.style.display = "grid";
    fatal.textContent = "Tone.js could not be loaded. Please check network connectivity.";
    return;
  }

  const stage = document.getElementById("stage");
  const store = new Store();
  const engine = new AudioEngine();

  const renderer = new Renderer(
    document.getElementById("layer-static"),
    document.getElementById("layer-dynamic"),
    document.getElementById("layer-minimap"),
    store, engine,
  );
  const session = new Session(store, engine, renderer);
  const video = new VideoExport(store, engine, renderer, session);

  const deck = new Deck(document.getElementById("deck-controls"), store, engine, renderer, session, video, {
    toggleTheme: () => {
      const next = store.get().theme === "vellum" ? "obsidian" : "vellum";
      applyTheme(next, store, renderer, session);
      renderer.console.push("THEME", next);
    },
  });

  // The DOM debug log, metadata panel, and FPS meter are gone per the "no
  // diagnostics console" brief -- the score should read as an artwork, not
  // a control panel. renderer.console is already a safe permanent no-op
  // (see Renderer's constructor), so nothing here needs to feed it.
  const macro = document.getElementById("deck-macro");

  session.onFrameZero = (canvas, err) => {
    if (canvas) console.info(`[frame0] ready ${canvas.width}x${canvas.height}`);
  };

  renderer.onFrame = (t, stats) => {
    deck.update(t);
    video.tick(t);
    const score = store.get().score;
    if (score && store.get().playing && t >= score.durSec && !video.active) {
      engine.pause();
      store.set({ playing: false });
    }
  };

  renderer.onPrologueEnd = async () => {
    if (Tone.context.state === "running") {
      if (!store.get().playing) void deck.toggle();
    } else {
      deck.setStatus("Click anywhere or press Space to play", "");
    }
  };

  stage.addEventListener("pointerdown", async (e) => {
    if (renderer.prologue.active) { renderer.skipPrologue(); }
    await engine.unlock();
    const view = renderer.getView();
    const fit = renderer.fit;
    if (!view || !fit || !fit.scale) return;
    const rect = stage.getBoundingClientRect();
    const plateX = (e.clientX - rect.left - fit.offsetX) / fit.scale;
    engine.seek(secOfX(view, plateX, engine.scoreSeconds));
    if (!store.get().playing) void deck.toggle();
  });

  macro.addEventListener("pointerdown", async (e) => {
    await engine.unlock();
    const score = store.get().score;
    const rect = macro.getBoundingClientRect();
    engine.seek(((e.clientX - rect.left) / rect.width) * (score ? score.durSec : 0));
  });

  window.addEventListener("keydown", async (e) => {
    if (e.target instanceof HTMLInputElement || e.target instanceof HTMLSelectElement) return;
    if (e.key === " " || e.key === "ArrowLeft" || e.key === "ArrowRight") {
      await engine.unlock();
    }
    switch (e.key) {
      case " ":
        e.preventDefault();
        if (renderer.prologue.active) renderer.skipPrologue(); else deck.toggle();
        break;
      case "ArrowLeft": engine.seek(engine.scoreSeconds - 5); break;
      case "ArrowRight": engine.seek(engine.scoreSeconds + 5); break;
      case "Home": case "r": case "R": engine.seek(0); break;
      case "m": case "M": {
        const on = engine.toggleMonitor();
        deck.setStatus(on ? "Audio on" : "Audio muted", "");
        break;
      }
      case "p": case "P": store.set({ presentation: !store.get().presentation }); break;
      case "t": case "T": {
        const next = store.get().theme === "vellum" ? "obsidian" : "vellum";
        applyTheme(next, store, renderer, session);
        break;
      }
      case "g": case "G":
        renderer.showRules = !renderer.showRules;
        renderer.staticDirty = true;
        renderer.console.push("PLATE", renderer.showRules ? "rules on" : "rules off");
        break;
    }
  });

  store.subscribe((s, changed) => {
    if (changed.has("presentation")) {
      document.body.classList.toggle("presenting", s.presentation);
      requestAnimationFrame(() => renderer.resize());
    }
  });

  const observer = new ResizeObserver(() => renderer.resize());
  observer.observe(stage);
  observer.observe(macro);

  window.addEventListener("error", (e) => {
    renderer.console.push("ERROR", String((e && e.message) || "unknown").slice(0, 46));
  });
  window.addEventListener("unhandledrejection", (e) => {
    const r = e && e.reason;
    renderer.console.push("ERROR", String((r && r.message) || r || "rejected").slice(0, 46));
  });

  window.addEventListener("beforeunload", () => { renderer.stop(); engine.dispose(); });

  applyTheme(DEFAULT_THEME, store, renderer, session);
  deck.syncTheme(DEFAULT_THEME);
  session.open(defaultFixture(), { title: "Fugue in C minor (Exposition)", catalogue: "BWV 847" });

  window.Counterpoint = {
    store, engine, renderer, session, video, deck,
    analyze, estimateKey, buildScore, ingestMidi, validateScore,
    buildMonogram, drawMonogram, layoutView, xOfSec, yOfMidi,
    cleanTitle, extractCatalogue,
    THEMES, applyTheme: (id) => applyTheme(id, store, renderer, session),
  };
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
</script>
</body>
</html>
